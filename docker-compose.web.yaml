# The web client on a server (docs/ops/deployment.md): Caddy, with TLS from
# Let's Encrypt, serves the site of the pluma-web image and proxies its
# WebSocket /apiws to the gateway's PROXY protocol listener (11444, on
# teamgram_net only, teamgramd/deploy/web/Caddyfile). The gateway's own
# WebSocket port 11443 is then not published: web clients come through the
# proxy only, with their real addresses. Added to the services command after
# docker-compose.public-ip.yaml:
#
#   docker compose -f docker-compose.yaml -f docker-compose.public-ip.yaml -f docker-compose.web.yaml ...
services:
  gnetway:
    ports: !override
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:10443:10443" # MTProto TCP
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:5222:5222"   # MTProto TCP, alternative port

  web:
    mem_limit: 256m
    memswap_limit: 256m
    cgroup_parent: ${PLUMA_CGROUP_PARENT:-}
    image: ${PLUMA_WEB_IMAGE:?set PLUMA_WEB_IMAGE in .env, the pluma-web image of the site}
    restart: unless-stopped
    environment:
      PLUMA_WEB_DOMAIN: ${PLUMA_WEB_DOMAIN:?set PLUMA_WEB_DOMAIN in .env, the name of the web client}
      PLUMA_SITE_DOMAINS: ${PLUMA_SITE_DOMAINS:?set PLUMA_SITE_DOMAINS in .env, the other names of the site}
      # The provider of the login on sites (task 106): its DNS record points
      # here as the site's does.
      PLUMA_OAUTH_DOMAIN: ${PLUMA_OAUTH_DOMAIN:-oauth.pluma.chat}
      # The name the CDN resource pulls large files from (task 107,
      # docs/ops/cdn.md): Caddy proxies it to bff's origin listener on
      # teamgram_net. Empty: no such site.
      PLUMA_CDN_ORIGIN_DOMAIN: ${PLUMA_CDN_ORIGIN_DOMAIN:-}
      # The name of the public map tiles of the clients' maps and the key
      # in their paths (task 112, docs/ops/maps.md): Caddy proxies them to
      # maps-tiles of docker-compose.maps.yaml on maps_public_net. Empty
      # name: no such site.
      PLUMA_MAPS_DOMAIN: ${PLUMA_MAPS_DOMAIN:-}
      MAPS_PUBLIC_KEY: ${MAPS_PUBLIC_KEY:-}
      # The origin of the CDN edge (task 109, docs/ops/edge.md): the name
      # the second Gcore resource pulls, and the X-Pluma-Edge-Auth value it
      # adds, 64 hex digits. Empty name: no such site.
      PLUMA_EDGE_ORIGIN_DOMAIN: ${PLUMA_EDGE_ORIGIN_DOMAIN:-}
      PLUMA_EDGE_ORIGIN_AUTH: ${PLUMA_EDGE_ORIGIN_AUTH:-}
      # The edge of the Russian node (task 109, docs/ops/ru-node.md), on
      # :8443, which docker-compose.ru.yaml publishes on the tunnel. Empty:
      # no such site.
      PLUMA_RU_EDGE_DOMAIN: ${PLUMA_RU_EDGE_DOMAIN:-}
      # The only address :8443 takes PROXY v1 from: the node in the plumaru
      # tunnel (teamgramd/deploy/edge/tunnel.sh --link ru). Not a setting of
      # the operator; the e2e stand sets its own.
      PLUMA_RU_EDGE_PROXY_FROM: 10.78.0.1/32
    # Caddy refuses a whole Caddyfile with a site of an empty address, so the
    # site of the CDN origin is a file of its own that the Caddyfile imports
    # from /etc/caddy/cdn-origin.d, linked there at every start only when
    # PLUMA_CDN_ORIGIN_DOMAIN is set (the variable changes only with a new
    # container); so is the site of the public map tiles, from
    # /etc/caddy/maps-public.d with PLUMA_MAPS_DOMAIN, whose key must be
    # there and fit (the rule of bff's MAPS_PUBLIC_URL), or Caddy does not
    # start; so are the edges of the clients (task 109): edge-origin.caddy
    # in /etc/caddy/edge-origin.d with PLUMA_EDGE_ORIGIN_DOMAIN, whose
    # PLUMA_EDGE_ORIGIN_AUTH must be 64 hex digits, or Caddy does not start
    # (an empty value would let every request through), and ru-edge.caddy
    # in /etc/caddy/ru-edge.d with PLUMA_RU_EDGE_DOMAIN. Then Caddy runs as
    # the image's own command runs it.
    tmpfs:
      - /etc/caddy/cdn-origin.d
      - /etc/caddy/maps-public.d
      - /etc/caddy/edge-origin.d
      - /etc/caddy/ru-edge.d
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$PLUMA_CDN_ORIGIN_DOMAIN" ]; then
          ln -s /etc/caddy/cdn-origin.caddy /etc/caddy/cdn-origin.d/cdn-origin.caddy
        fi
        if [ -n "$$PLUMA_MAPS_DOMAIN" ]; then
          case "$$MAPS_PUBLIC_KEY" in
            *[!A-Za-z0-9_-]*) bad=1 ;;
            *) bad= ;;
          esac
          if [ -n "$$bad" ] || [ "$${#MAPS_PUBLIC_KEY}" -lt 16 ] || [ "$${#MAPS_PUBLIC_KEY}" -gt 128 ]; then
            echo "PLUMA_MAPS_DOMAIN needs MAPS_PUBLIC_KEY of 16-128 characters of A-Z, a-z, 0-9, '-' or '_' (docs/ops/maps.md)" >&2
            exit 1
          fi
          ln -s /etc/caddy/maps-public.caddy /etc/caddy/maps-public.d/maps-public.caddy
        fi
        if [ -n "$$PLUMA_EDGE_ORIGIN_DOMAIN" ]; then
          case "$$PLUMA_EDGE_ORIGIN_AUTH" in
            *[!0-9a-f]*) bad=1 ;;
            *) bad= ;;
          esac
          if [ -n "$$bad" ] || [ "$${#PLUMA_EDGE_ORIGIN_AUTH}" -ne 64 ]; then
            echo "PLUMA_EDGE_ORIGIN_DOMAIN needs PLUMA_EDGE_ORIGIN_AUTH of 64 hex digits, openssl rand -hex 32 (docs/ops/edge.md)" >&2
            exit 1
          fi
          ln -s /etc/caddy/edge-origin.caddy /etc/caddy/edge-origin.d/edge-origin.caddy
        fi
        if [ -n "$$PLUMA_RU_EDGE_DOMAIN" ]; then
          ln -s /etc/caddy/ru-edge.caddy /etc/caddy/ru-edge.d/ru-edge.caddy
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./teamgramd/deploy/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./teamgramd/deploy/web/cdn-origin.caddy:/etc/caddy/cdn-origin.caddy:ro
      - ./teamgramd/deploy/web/maps-public.caddy:/etc/caddy/maps-public.caddy:ro
      - ./teamgramd/deploy/web/edge-origin.caddy:/etc/caddy/edge-origin.caddy:ro
      - ./teamgramd/deploy/web/ru-edge.caddy:/etc/caddy/ru-edge.caddy:ro
      # The landing page of PLUMA_SITE_DOMAINS: the dist/ of pluma-site,
      # copied to the host (docs/ops/deployment.md).
      - ${PLUMA_SITE_DIR:-/srv/pluma-site}:/pluma-site:ro
      # The progress the site shows (/progress.json): generated with the code
      # (tools/apicoverage), so it is the deployed version's. The directory,
      # not the file, so a new checkout is seen without a restart; only the
      # one file is served.
      - ./docs/project:/pluma-progress:ro
      # Other sites of the operator on the same address (the end of the
      # Caddyfile): server-local, never in the repository.
      - ${PLUMA_CADDY_SITES_DIR:-/srv/pluma-caddy-sites}:/etc/caddy/sites.d:ro
      # The ACME account and the certificates: kept over restarts, so that
      # Let's Encrypt's rate limits are never in the way.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:80:80"
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:443:443"
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:443:443/udp" # HTTP/3
    # maps_public_net reaches maps-tiles (docker-compose.maps.yaml), which
    # is on no other network. Caddy registers nowhere, so the order of its
    # interfaces does not matter (TestComposeServicesRegisteredAddress), and
    # an internal network never carries the published ports.
    networks:
      - teamgram_net
      - maps_public_net
    depends_on:
      gnetway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s

volumes:
  caddy_data:
  caddy_config:

networks:
  # The network of the public map tiles: Caddy and maps-tiles alone
  # (docker-compose.maps.yaml declares it the same way); without the maps
  # overlay nothing else is on it.
  maps_public_net:
    internal: true
