# The web client on a server (docs/ops/deployment.md): Caddy, with TLS from
# Let's Encrypt, serves the site of the pluma-web image and proxies its
# WebSocket /apiws to the gateway's PROXY protocol listener (11444, on
# teamgram_net only, teamgramd/deploy/web/Caddyfile). The gateway's own
# WebSocket port 11443 is then not published: web clients come through the
# proxy only, with their real addresses. Added to the services command after
# docker-compose.public-ip.yaml:
#
#   docker compose -f docker-compose.yaml -f docker-compose.public-ip.yaml -f docker-compose.web.yaml ...
services:
  gnetway:
    ports: !override
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:10443:10443" # MTProto TCP
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:5222:5222"   # MTProto TCP, alternative port

  web:
    mem_limit: 256m
    memswap_limit: 256m
    cgroup_parent: ${PLUMA_CGROUP_PARENT:-}
    image: ${PLUMA_WEB_IMAGE:?set PLUMA_WEB_IMAGE in .env, the pluma-web image of the site}
    restart: unless-stopped
    environment:
      PLUMA_WEB_DOMAIN: ${PLUMA_WEB_DOMAIN:?set PLUMA_WEB_DOMAIN in .env, the name of the web client}
      PLUMA_SITE_DOMAINS: ${PLUMA_SITE_DOMAINS:?set PLUMA_SITE_DOMAINS in .env, the other names of the site}
      # The provider of the login on sites (task 106): its DNS record points
      # here as the site's does.
      PLUMA_OAUTH_DOMAIN: ${PLUMA_OAUTH_DOMAIN:-oauth.pluma.chat}
      # The name the CDN resource pulls large files from (task 107,
      # docs/ops/cdn.md): Caddy proxies it to bff's origin listener on
      # teamgram_net. Empty: no such site.
      PLUMA_CDN_ORIGIN_DOMAIN: ${PLUMA_CDN_ORIGIN_DOMAIN:-}
    # Caddy refuses a whole Caddyfile with a site of an empty address, so the
    # site of the CDN origin is a file of its own that the Caddyfile imports
    # from /etc/caddy/cdn-origin.d, linked there at every start only when
    # PLUMA_CDN_ORIGIN_DOMAIN is set (the variable changes only with a new
    # container). Then Caddy runs as the image's own command runs it.
    tmpfs:
      - /etc/caddy/cdn-origin.d
    command:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$PLUMA_CDN_ORIGIN_DOMAIN" ]; then
          ln -s /etc/caddy/cdn-origin.caddy /etc/caddy/cdn-origin.d/cdn-origin.caddy
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./teamgramd/deploy/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./teamgramd/deploy/web/cdn-origin.caddy:/etc/caddy/cdn-origin.caddy:ro
      # The landing page of PLUMA_SITE_DOMAINS: the dist/ of pluma-site,
      # copied to the host (docs/ops/deployment.md).
      - ${PLUMA_SITE_DIR:-/srv/pluma-site}:/pluma-site:ro
      # The progress the site shows (/progress.json): generated with the code
      # (tools/apicoverage), so it is the deployed version's. The directory,
      # not the file, so a new checkout is seen without a restart; only the
      # one file is served.
      - ./docs/project:/pluma-progress:ro
      # Other sites of the operator on the same address (the end of the
      # Caddyfile): server-local, never in the repository.
      - ${PLUMA_CADDY_SITES_DIR:-/srv/pluma-caddy-sites}:/etc/caddy/sites.d:ro
      # The ACME account and the certificates: kept over restarts, so that
      # Let's Encrypt's rate limits are never in the way.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:80:80"
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:443:443"
      - "${PLUMA_PUBLIC_IPV4:-0.0.0.0}:443:443/udp" # HTTP/3
    networks:
      - teamgram_net
    depends_on:
      gnetway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s

volumes:
  caddy_data:
  caddy_config:
