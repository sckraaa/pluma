Name: service.authsession
ListenOn: 127.0.0.1:20450
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: service.authsession
Mysql:
  Addr: 127.0.0.1:3306
  DSN: root:@tcp(127.0.0.1:3306)/teamgram?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai
  Active: 64
  Idle: 64
  IdleTimeout: 4h
  QueryTimeout: 5s
  ExecTimeout: 5s
  TranTimeout: 5s
Cache:
  - Host: 127.0.0.1:6379
KV:
  - Host: 127.0.0.1:6379

# Seals the auth keys at rest (task 008, pkg/authkeys): the hex of 32 random
# bytes, kept outside the database. Without it authsession does not start;
# with another one it cannot read the stored keys. See
# docs/ops/security-setup.md.
AuthKeyEncryptionKey: "${AUTH_KEY_ENCRYPTION_KEY}"
