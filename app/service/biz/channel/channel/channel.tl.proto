// ImmutableChannel <--
//  + TL_immutableChannel
//
message ImmutableChannel {
    string predicate_name = 1;
    TLConstructor  constructor = 2;
    bool broadcast = 3;
    bool megagroup = 4;
    bool forum = 5;
    bool signatures = 6;
    bool noforwards = 7;
    bool join_to_send = 8;
    bool join_request = 9;
    bool participants_hidden = 10;
    bool hidden_prehistory = 11;
    bool deleted = 12;
    int64 id = 13;
    int64 access_hash = 14;
    int64 creator_user_id = 15;
    string title = 16;
    string about = 17;
    mtproto.Photo photo = 18;
    string username = 19;
    int32 participants_count = 20;
    int32 admins_count = 21;
    int32 kicked_count = 22;
    int32 banned_count = 23;
    int32 default_banned_rights = 24;
    int32 slowmode_seconds = 25;
    int64 linked_chat_id = 26;
    int64 migrated_from_chat_id = 27;
    int32 migrated_from_max_id = 28;
    int32 pts = 29;
    int32 top_message = 30;
    int32 version = 31;
    int64 date = 32;
    // pluma: task 044, the reactions the members may use
    // (chatReactions: 0 none, 1 all, 2 some, as biz chat keeps them).
    int32 available_reactions_type = 33;
    repeated string available_reactions = 34;
    // pluma: task 045, signatures that link to the authors' profiles
    // (channel.signature_profiles).
    bool signature_profiles = 35;
    // pluma: task 060: flags.15, the tabbed layout of a forum.
    bool forum_tabs = 40;
    // pluma: task 074: flags2.23, the topics of a forum in a sidebar (layer 233).
    bool forum_sidebar = 42;
    // pluma: task 072: flags.16, blocked by the owner of the server (the
    // members see it restricted; channel.setBlocked).
    bool blocked = 41;
    // pluma: task 078: how the channel looks (channels.updateColor,
    // channels.updateEmojiStatus): the color of its name and of its
    // profile, nil for none, and its emoji status, nil for none.
    mtproto.PeerColor color = 43;
    mtproto.PeerColor profile_color = 44;
    mtproto.EmojiStatus emoji_status = 45;
    // pluma: task 078: every username of the channel, in its order, when it
    // has more than one (channel.usernames); username is the editable one.
    repeated mtproto.Username usernames = 46;
}

message TL_immutableChannel {
    ImmutableChannel data2 = 1;
}


// ImmutableChannelParticipant <--
//  + TL_immutableChannelParticipant
//
message ImmutableChannelParticipant {
    string predicate_name = 1;
    TLConstructor  constructor = 2;
    int64 channel_id = 3;
    int64 user_id = 4;
    int32 role = 5;
    int32 state = 6;
    int32 admin_rights = 7;
    string rank = 8;
    int32 banned_rights = 9;
    int32 until_date = 10;
    int64 inviter_user_id = 11;
    int64 promoted_by = 12;
    int64 kicked_by = 13;
    int32 available_min_id = 14;
    int64 date = 15;
    // pluma: task 045, the last message sent under the slow mode.
    int64 last_send_date = 16;
}

message TL_immutableChannelParticipant {
    ImmutableChannelParticipant data2 = 1;
}


// MutableChannel <--
//  + TL_mutableChannel
//
message MutableChannel {
    string predicate_name = 1;
    TLConstructor  constructor = 2;
    ImmutableChannel channel = 3;
    repeated ImmutableChannelParticipant participants = 4;
}

message TL_mutableChannel {
    MutableChannel data2 = 1;
}





//--------------------------------------------------------------------------------------------
message TL_channel_getMutableChannel {
    TLConstructor  constructor = 1;
    int64 channel_id = 3;
    repeated int64 id = 4;
}

//--------------------------------------------------------------------------------------------
message TL_channel_getChannelListByIdList {
    TLConstructor  constructor = 1;
    int64 self_id = 3;
    repeated int64 id_list = 4;
}


//--------------------------------------------------------------------------------------------
// pluma: channel.createChannel creator_id:long title:string about:string broadcast:Bool megagroup:Bool forum:Bool = Updates;
// Creates a channel (broadcast) or a supergroup (megagroup) of creator_id in
// its box transaction: the channel, its creator, its first message, the
// creator's dialog and invite link; the answer of channels.createChannel.
message TL_channel_createChannel {
  TLConstructor constructor = 1;
  int64 creator_id = 3;
  string title = 4;
  string about = 5;
  mtproto.Bool broadcast = 6;
  mtproto.Bool megagroup = 7;
  // pluma: task 060
  mtproto.Bool forum = 8;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getChannelDialogs self_id:long id_list:Vector<long> = Vector<Dialog>;
// The dialogs of self_id with the channels id_list, as it sees them: pts,
// top_message, read marks and unread counts computed from the channel
// (ADR 0034, p. 1); a channel without its dialog is left out.
message TL_channel_getChannelDialogs {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  repeated int64 id_list = 4;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getTopMessages self_id:long id_list:Vector<long> = Vector<Message>;
// The last message of each channel id_list, as self_id sees it.
message TL_channel_getTopMessages {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  repeated int64 id_list = 4;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getMemberIdList channel_id:long = Vector<long>;
// The users in the channel now (state 0), the recipients of its updates.
message TL_channel_getMemberIdList {
  TLConstructor constructor = 1;
  int64 channel_id = 3;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getHistory self_id:long channel_id:long offset_id:int offset_date:int add_offset:int limit:int max_id:int min_id:int = messages.Messages;
// A page of the channel's history as self_id sees it: messages.channelMessages
// with the channel's pts and the count of the messages self_id may see; the
// chats and users are the caller's to fill.
message TL_channel_getHistory {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  int32 offset_id = 5;
  int32 offset_date = 6;
  int32 add_offset = 7;
  int32 limit = 8;
  int32 max_id = 9;
  int32 min_id = 10;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getMessages self_id:long channel_id:long id:Vector<int> = Vector<Message>;
// The messages id of the channel that self_id may see, as it sees them, in the
// order asked; a missing one is left out.
message TL_channel_getMessages {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  repeated int32 id = 5;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getChannelDifference self_id:long channel_id:long pts:int limit:int = updates.ChannelDifference;
// The difference of the channel from pts as self_id sees it (ADR 0034, p. 4):
// empty, a slice of the journal folded, or too long with the dialog; the
// chats and users are the caller's to fill.
message TL_channel_getChannelDifference {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  int32 pts = 5;
  int32 limit = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.joinChannel self_id:long perm_auth_key_id:long channel_id:long link:string = Updates;
// self_id joins the channel: a public one by itself (link empty), any
// one by its invite link (ADR 0034, p. 3). The users of the answer are
// the caller's to add.
message TL_channel_joinChannel {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  string link = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.leaveChannel self_id:long perm_auth_key_id:long channel_id:long = Updates;
// self_id leaves the channel (ADR 0034, p. 3).
message TL_channel_leaveChannel {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.checkChatInvite self_id:long link:string = ChatInvite;
// What the invite link of a channel shows self_id: chatInviteAlready to a
// member, chatInvite to anyone else.
message TL_channel_checkChatInvite {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  string link = 4;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getParticipants self_id:long channel_id:long filter:string q:string offset:int limit:int = channels.ChannelParticipants;
// A page of the channel's participants as self_id may see them, by the
// predicate of channelParticipantsFilter; the users are the caller's to
// add.
message TL_channel_getParticipants {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  string filter = 5;
  string q = 6;
  int32 offset = 7;
  int32 limit = 8;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.readHistory self_id:long perm_auth_key_id:long channel_id:long max_id:int = Bool;
// self_id read the channel up to max_id (0: all): its dialog, its
// mentions, updateReadChannelInbox with seq to its devices and
// updateReadChannelOutbox to the authors in a supergroup (ADR 0034, p. 3).
message TL_channel_readHistory {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  int32 max_id = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.deleteMessages self_id:long perm_auth_key_id:long channel_id:long id:Vector<int> = messages.AffectedMessages;
// self_id deletes messages of the channel for everyone: one row of the
// channel's journal, pushed to the members.
message TL_channel_deleteMessages {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  repeated int32 id = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.inviteToChannel self_id:long perm_auth_key_id:long channel_id:long id:Vector<long> = Updates;
// self_id adds users id to the channel: their participant rows, the
// service message of a supergroup, an inbox event for each (ADR 0034,
// p. 3). The users of the answer are the caller's to add.
message TL_channel_inviteToChannel {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  repeated int64 id = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.editTitle self_id:long perm_auth_key_id:long channel_id:long title:string = Updates;
