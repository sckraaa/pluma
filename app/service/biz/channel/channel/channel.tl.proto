// (task 043)
message TL_channel_readMentions {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getUnreadMentions self_id:long channel_id:long offset_id:int add_offset:int limit:int max_id:int min_id:int = messages.Messages;
// The messages of the channel that mention self_id and that it has not read,
// paged as channel.getHistory, newest first (task 043).
// (task 043)
message TL_channel_getUnreadMentions {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  int32 offset_id = 5;
  int32 add_offset = 6;
  int32 limit = 7;
  int32 max_id = 8;
  int32 min_id = 9;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.editPhoto self_id:long perm_auth_key_id:long channel_id:long photo_id:long = Updates;
// self_id gives the channel the photo photo_id, or takes it away with 0
// (channels.editPhoto); a service message tells the members (task 044).
// (task 044)
message TL_channel_editPhoto {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  int64 photo_id = 6;
}

//--------------------------------------------------------------------------------------------
// Vector api result type
// pluma: task 039
message Vector_Long {
    repeated int64 datas = 1;
}

// pluma: task 038
message Vector_Dialog {
    repeated mtproto.Dialog datas = 1;
}

// pluma: task 038
message Vector_Message {
    repeated mtproto.Message datas = 1;
}

message Vector_MutableChannel {
    repeated MutableChannel datas = 1;
}


