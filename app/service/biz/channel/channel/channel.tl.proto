// ImmutableChannel <--
//  + TL_immutableChannel
//
message ImmutableChannel {
    string predicate_name = 1;
    TLConstructor  constructor = 2;
    bool broadcast = 3;
    bool megagroup = 4;
    bool forum = 5;
    bool signatures = 6;
    bool noforwards = 7;
    bool join_to_send = 8;
    bool join_request = 9;
    bool participants_hidden = 10;
    bool hidden_prehistory = 11;
    bool deleted = 12;
    int64 id = 13;
    int64 access_hash = 14;
    int64 creator_user_id = 15;
    string title = 16;
    string about = 17;
    mtproto.Photo photo = 18;
    string username = 19;
    int32 participants_count = 20;
    int32 admins_count = 21;
    int32 kicked_count = 22;
    int32 banned_count = 23;
    int32 default_banned_rights = 24;
    int32 slowmode_seconds = 25;
    int64 linked_chat_id = 26;
    int64 migrated_from_chat_id = 27;
    int32 migrated_from_max_id = 28;
    int32 pts = 29;
    int32 top_message = 30;
    int32 version = 31;
    int64 date = 32;
}

message TL_immutableChannel {
    ImmutableChannel data2 = 1;
}


// ImmutableChannelParticipant <--
//  + TL_immutableChannelParticipant
//
message ImmutableChannelParticipant {
    string predicate_name = 1;
    TLConstructor  constructor = 2;
    int64 channel_id = 3;
    int64 user_id = 4;
    int32 role = 5;
    int32 state = 6;
    int32 admin_rights = 7;
    string rank = 8;
    int32 banned_rights = 9;
    int32 until_date = 10;
    int64 inviter_user_id = 11;
    int64 promoted_by = 12;
    int64 kicked_by = 13;
    int32 available_min_id = 14;
    int64 date = 15;
}

message TL_immutableChannelParticipant {
    ImmutableChannelParticipant data2 = 1;
}


// MutableChannel <--
//  + TL_mutableChannel
//
message MutableChannel {
    string predicate_name = 1;
    TLConstructor  constructor = 2;
    ImmutableChannel channel = 3;
    repeated ImmutableChannelParticipant participants = 4;
}

message TL_mutableChannel {
    MutableChannel data2 = 1;
}





//--------------------------------------------------------------------------------------------
message TL_channel_getMutableChannel {
    TLConstructor  constructor = 1;
    int64 channel_id = 3;
    repeated int64 id = 4;
}

//--------------------------------------------------------------------------------------------
message TL_channel_getChannelListByIdList {
    TLConstructor  constructor = 1;
    int64 self_id = 3;
    repeated int64 id_list = 4;
}


//--------------------------------------------------------------------------------------------
// pluma: channel.createChannel creator_id:long title:string about:string broadcast:Bool megagroup:Bool = Updates;
// Creates a channel (broadcast) or a supergroup (megagroup) of creator_id in
// its box transaction: the channel, its creator, its first message, the
// creator's dialog and invite link; the answer of channels.createChannel.
message TL_channel_createChannel {
  TLConstructor constructor = 1;
  int64 creator_id = 3;
  string title = 4;
  string about = 5;
  mtproto.Bool broadcast = 6;
  mtproto.Bool megagroup = 7;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getChannelDialogs self_id:long id_list:Vector<long> = Vector<Dialog>;
// The dialogs of self_id with the channels id_list, as it sees them: pts,
// top_message, read marks and unread counts computed from the channel
// (ADR 0034, p. 1); a channel without its dialog is left out.
message TL_channel_getChannelDialogs {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  repeated int64 id_list = 4;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getTopMessages self_id:long id_list:Vector<long> = Vector<Message>;
// The last message of each channel id_list, as self_id sees it.
message TL_channel_getTopMessages {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  repeated int64 id_list = 4;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getMemberIdList channel_id:long = Vector<long>;
// The users in the channel now (state 0), the recipients of its updates.
message TL_channel_getMemberIdList {
  TLConstructor constructor = 1;
  int64 channel_id = 3;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getHistory self_id:long channel_id:long offset_id:int offset_date:int add_offset:int limit:int max_id:int min_id:int = messages.Messages;
// A page of the channel's history as self_id sees it: messages.channelMessages
// with the channel's pts and the count of the messages self_id may see; the
// chats and users are the caller's to fill.
message TL_channel_getHistory {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  int32 offset_id = 5;
  int32 offset_date = 6;
  int32 add_offset = 7;
  int32 limit = 8;
  int32 max_id = 9;
  int32 min_id = 10;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getMessages self_id:long channel_id:long id:Vector<int> = Vector<Message>;
// The messages id of the channel that self_id may see, as it sees them, in the
// order asked; a missing one is left out.
message TL_channel_getMessages {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  repeated int32 id = 5;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getChannelDifference self_id:long channel_id:long pts:int limit:int = updates.ChannelDifference;
// The difference of the channel from pts as self_id sees it (ADR 0034, p. 4):
// empty, a slice of the journal folded, or too long with the dialog; the
// chats and users are the caller's to fill.
message TL_channel_getChannelDifference {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  int32 pts = 5;
  int32 limit = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.joinChannel self_id:long perm_auth_key_id:long channel_id:long link:string = Updates;
// self_id joins the channel: a public one by itself (link empty), any
// one by its invite link (ADR 0034, p. 3). The users of the answer are
// the caller's to add.
message TL_channel_joinChannel {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  string link = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.leaveChannel self_id:long perm_auth_key_id:long channel_id:long = Updates;
// self_id leaves the channel (ADR 0034, p. 3).
message TL_channel_leaveChannel {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.checkChatInvite self_id:long link:string = ChatInvite;
// What the invite link of a channel shows self_id: chatInviteAlready to a
// member, chatInvite to anyone else.
message TL_channel_checkChatInvite {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  string link = 4;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getParticipants self_id:long channel_id:long filter:string q:string offset:int limit:int = channels.ChannelParticipants;
// A page of the channel's participants as self_id may see them, by the
// predicate of channelParticipantsFilter; the users are the caller's to
// add.
message TL_channel_getParticipants {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  string filter = 5;
  string q = 6;
  int32 offset = 7;
  int32 limit = 8;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.readHistory self_id:long perm_auth_key_id:long channel_id:long max_id:int = Bool;
// self_id read the channel up to max_id (0: all): its dialog, its
// mentions, updateReadChannelInbox with seq to its devices and
// updateReadChannelOutbox to the authors in a supergroup (ADR 0034, p. 3).
message TL_channel_readHistory {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  int32 max_id = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.deleteMessages self_id:long perm_auth_key_id:long channel_id:long id:Vector<int> = messages.AffectedMessages;
// self_id deletes messages of the channel for everyone: one row of the
// channel's journal, pushed to the members.
message TL_channel_deleteMessages {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  repeated int32 id = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.inviteToChannel self_id:long perm_auth_key_id:long channel_id:long id:Vector<long> = Updates;
// self_id adds users id to the channel: their participant rows, the
// service message of a supergroup, an inbox event for each (ADR 0034,
// p. 3). The users of the answer are the caller's to add.
message TL_channel_inviteToChannel {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  repeated int64 id = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.editTitle self_id:long perm_auth_key_id:long channel_id:long title:string = Updates;
// self_id renames the channel: a service message and updateChannel for
// the members. The users of the answer are the caller's to add.
message TL_channel_editTitle {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  string title = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.editAbout self_id:long perm_auth_key_id:long channel_id:long about:string = Bool;
// self_id changes the description of the channel; the members load it
// again.
message TL_channel_editAbout {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  string about = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.checkUsername self_id:long channel_id:long username:string = Bool;
// Whether self_id may give the channel (0: one not made yet) the
// username: false when another peer has it.
message TL_channel_checkUsername {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  string username = 5;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.updateUsername self_id:long perm_auth_key_id:long channel_id:long username:string = Bool;
// self_id gives the channel the username, "" makes it private.
message TL_channel_updateUsername {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  string username = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.getAdminedPublicChannels self_id:long = Vector<long>;
// The public channels self_id created, newest first.
message TL_channel_getAdminedPublicChannels {
  TLConstructor constructor = 1;
  int64 self_id = 3;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.deleteChannel self_id:long perm_auth_key_id:long channel_id:long = Updates;
// self_id, the creator, deletes the channel for everyone: it is marked
// deleted, its members leave and lose the dialog, its username and links
// go; each other member gets an inbox event (task 055).
message TL_channel_deleteChannel {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.editAdmin self_id:long perm_auth_key_id:long channel_id:long user_id:long admin_rights:int rank:string keep_rank:Bool = Updates;
// self_id sets the admin rights of user_id in the channel (channels.editAdmin):
// admin_rights 0 takes them away; rank is kept when keep_rank is true.
// (task 042)
message TL_channel_editAdmin {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  int64 user_id = 6;
  int32 admin_rights = 7;
  string rank = 8;
  mtproto.Bool keep_rank = 9;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.editBanned self_id:long perm_auth_key_id:long channel_id:long user_id:long banned_rights:int until_date:int = Updates;
// self_id restricts, kicks or frees user_id in the channel (channels.editBanned):
// banned_rights are the flags of chatBannedRights, until_date as the client sent it.
// (task 042)
message TL_channel_editBanned {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  int64 user_id = 6;
  int32 banned_rights = 7;
  int32 until_date = 8;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.editDefaultBannedRights self_id:long perm_auth_key_id:long channel_id:long banned_rights:int = Updates;
// self_id sets the restrictions of every member of the supergroup
// (messages.editChatDefaultBannedRights).
// (task 042)
message TL_channel_editDefaultBannedRights {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  int32 banned_rights = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.editCreator self_id:long perm_auth_key_id:long channel_id:long user_id:long = Updates;
// self_id, the creator, hands the channel to user_id (channels.editCreator,
// messages.editChatCreator); the caller has checked the 2FA password.
// (task 042)
message TL_channel_editCreator {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 perm_auth_key_id = 4;
  int64 channel_id = 5;
  int64 user_id = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.search self_id:long channel_id:long q:string from_id:long media_type:int min_date:int max_date:int offset_id:int add_offset:int limit:int max_id:int min_id:int = messages.Messages;
// The messages of the channel that self_id may see and that match: the text q,
// the author from_id, the kind media_type (MEDIA_*, -1 any, MEDIA_PINNED the
// pinned), the dates; paged as channel.getHistory, newest first (task 043).
// (task 043)
message TL_channel_search {
  TLConstructor constructor = 1;
  int64 self_id = 3;
  int64 channel_id = 4;
  string q = 5;
  int64 from_id = 6;
  int32 media_type = 7;
  int32 min_date = 8;
  int32 max_date = 9;
  int32 offset_id = 10;
  int32 add_offset = 11;
  int32 limit = 12;
  int32 max_id = 13;
  int32 min_id = 14;
}

//--------------------------------------------------------------------------------------------
// pluma: channel.readMessageContents self_id:long perm_auth_key_id:long channel_id:long id:Vector<int> = Bool;
// self_id has seen the contents of messages id of the channel: its mentions
