// The control API of a CDN node (ADR 0065 §5). The home (bff) calls it over
// mutual TLS on the tunnel address; the node serves the cipher of files to
// clients over MTProto and knows neither the files nor their keys.
//
// Regenerate with app/service/cdn/cdn/gen.sh.

syntax = "proto3";

package cdn;

option go_package = "github.com/teamgram/teamgram-server/app/service/cdn/cdn";

service CDN {
  // Status is what the home checks the node by every few seconds.
  rpc Status(StatusRequest) returns (StatusResponse);
  // SetRequestTokenKeys hands the node the key it signs the request_token
  // of upload.cdnFileReuploadNeeded with. The node keeps it in memory only:
  // after a restart (a new boot_id) the home sends it again.
  rpc SetRequestTokenKeys(SetRequestTokenKeysRequest) returns (SetRequestTokenKeysResponse);
  // Put stores the cipher of one file: a header, then the bytes in chunks.
  // The file appears to clients only when all of size bytes arrived; a
  // broken stream leaves nothing. Errors: INVALID_ARGUMENT (no header, a
  // token that is not 32 bytes, more or fewer bytes than size),
  // RESOURCE_EXHAUSTED (size above the cache, or the disk below its
  // reserve), INTERNAL (the disk failed).
  rpc Put(stream PutRequest) returns (PutResponse);
  // Delete removes a file; deleted is false when the node did not have it.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  // Inventory lists every file the node holds.
  rpc Inventory(InventoryRequest) returns (stream InventoryItem);
}

message StatusRequest {}

message StatusResponse {
  // dc_id is the CDN DC the node serves (CDN_DC_ID).
  int32 dc_id = 1;
  // public_key_pem is the node's MTProto RSA key, PKCS#1 PEM, as
  // help.getCdnConfig hands it to clients.
  string public_key_pem = 2;
  // fingerprint is the MTProto fingerprint of that key, as resPQ carries it
  // (a TL long).
  int64 fingerprint = 3;
  // boot_id is 16 random bytes made at every start of the node.
  bytes boot_id = 4;
  // cache_used is the bytes of the files held, cache_cap their ceiling
  // (CDN_CACHE_BYTES).
  int64 cache_used = 5;
  int64 cache_cap = 6;
  // egress_month (YYYY-MM, UTC) and egress_bytes: what the node has sent to
  // clients this month, transport included; kept across restarts.
  string egress_month = 7;
  int64 egress_bytes = 8;
  // cache_files is how many files the node holds.
  int64 cache_files = 9;
  // disk_free is the free space of the data volume; disk_low is set when it
  // is below the node's reserve, and Put is refused then.
  int64 disk_free = 10;
  bool disk_low = 11;
  // request_token_keys_set is false until SetRequestTokenKeys after a
  // start; until then upload.getCdnFile of a file the node does not have
  // answers FILE_TOKEN_INVALID (the client goes back to the home).
  bool request_token_keys_set = 12;
}

message SetRequestTokenKeysRequest {
  // current is the key in force (32 bytes); the node signs with it.
  bytes current = 1;
  // previous is the key before it (32 bytes, or empty). The node does not
  // sign with it; it is part of the call so that both sides name the same
  // pair.
  bytes previous = 2;
}

message SetRequestTokenKeysResponse {}

message PutHeader {
  // file_token is the 32-byte token clients ask the file by.
  bytes file_token = 1;
  // size is the size of the cipher, the same as the file's.
  int64 size = 2;
}

message PutRequest {
  oneof part {
    // header comes first, once.
    PutHeader header = 1;
    // chunk is the next bytes of the cipher, at most 1 MiB.
    bytes chunk = 2;
  }
}

message PutResponse {
  // size and sha256 are of the bytes the node stored: the home compares
  // them with what it sent before it lets clients to the node.
  int64 size = 1;
  bytes sha256 = 2;
}

message DeleteRequest {
  bytes file_token = 1;
}

message DeleteResponse {
  bool deleted = 1;
}

message InventoryRequest {}

message InventoryItem {
  bytes file_token = 1;
  int64 size = 2;
}
