  int32 peer_type = 5;
  int64 peer_id = 6;
  repeated mtproto.MessageBox box_list = 7;
  repeated mtproto.User users = 8;
  repeated mtproto.Chat chats = 9;
}

//--------------------------------------------------------------------------------------------
// inbox.editMessageToInboxV2 flags:# user_id:long from_id:long peer_type:int peer_id:long new_message:MessageBox users:flags.2?Vector<User> chats:flags.3?Vector<Chat> = Void;
message TL_inbox_editMessageToInboxV2 {
  TLConstructor constructor = 1;
  int64 user_id = 3;
  int64 from_id = 4;
  int32 peer_type = 5;
  int64 peer_id = 6;
  mtproto.MessageBox new_message = 7;
  repeated mtproto.User users = 8;
  repeated mtproto.Chat chats = 9;
}

//--------------------------------------------------------------------------------------------
// inbox.readOutboxHistory user_id:long from_id:long peer_type:int peer_id:long max_dialog_message_id:long = Void;
// from_id read the dialog up to user_id's message max_dialog_message_id.
message TL_inbox_readOutboxHistory {
  TLConstructor constructor = 1;
  int64 user_id = 3;
  int64 from_id = 4;
  int32 peer_type = 5;
  int64 peer_id = 6;
  int64 max_dialog_message_id = 7;
}

//--------------------------------------------------------------------------------------------
