syntax = "proto3";

package inbox;

import "schema.tl.sync.proto";

option go_package = "github.com/teamgram/teamgram-server/app/messenger/msg/inbox/inbox";

enum TLConstructor {
  CRC32_UNKNOWN = 0;
  CRC32_inbox_deleteMessagesToInbox = -271057483;
  CRC32_inbox_deleteUserHistoryToInbox = -259724490;
  CRC32_inbox_deleteChatHistoryToInbox = -1323388588;
  CRC32_inbox_updatePinnedMessage = -1980705534;
  CRC32_inbox_unpinAllMessages = 617411952;
  CRC32_inbox_sendUserMessageToInboxV2 = 1986907164;
  CRC32_inbox_editMessageToInboxV2 = 483635893;
  CRC32_inbox_readOutboxHistory = 1648518477;
  CRC32_inbox_readMediaUnreadToInboxV2 = 561453834;
}

// Every event is addressed to one user, user_id: it changes that user's box
// only and its Kafka key is user_id. from_id is the user whose operation
// caused it. peer_type and peer_id name the dialog as from_id sees it: the
// recipient for a private chat (whose dialog with from_id is then
// peer_type/from_id), the chat for a basic group.

//--------------------------------------------------------------------------------------------
// inbox.deleteMessagesToInbox user_id:long from_id:long peer_type:int peer_id:long id:Vector<long> = Void;
// id: dialog_message_id of the deleted messages
message TL_inbox_deleteMessagesToInbox {
  TLConstructor constructor = 1;
  int64 user_id = 3;
  int64 from_id = 4;
  int32 peer_type = 5;
  int64 peer_id = 6;
  repeated int64 id = 7;
}

//--------------------------------------------------------------------------------------------
// inbox.deleteUserHistoryToInbox user_id:long from_id:long = Void;
message TL_inbox_deleteUserHistoryToInbox {
  TLConstructor constructor = 1;
  int64 user_id = 3;
  int64 from_id = 4;
}

//--------------------------------------------------------------------------------------------
// inbox.deleteChatHistoryToInbox user_id:long from_id:long peer_chat_id:long = Void;
message TL_inbox_deleteChatHistoryToInbox {
  TLConstructor constructor = 1;
  int64 user_id = 3;
  int64 from_id = 4;
  int64 peer_chat_id = 5;
}

//--------------------------------------------------------------------------------------------
// inbox.updatePinnedMessage flags:# user_id:long from_id:long unpin:flags.1?true peer_type:int peer_id:long dialog_message_id:long = Void;
message TL_inbox_updatePinnedMessage {
  TLConstructor constructor = 1;
  int64 user_id = 3;
  int64 from_id = 4;
  bool unpin = 5;
  int32 peer_type = 6;
  int64 peer_id = 7;
  int64 dialog_message_id = 8;
}

//--------------------------------------------------------------------------------------------
// inbox.unpinAllMessages user_id:long from_id:long peer_type:int peer_id:long = Void;
message TL_inbox_unpinAllMessages {
  TLConstructor constructor = 1;
  int64 user_id = 3;
  int64 from_id = 4;
  int32 peer_type = 5;
  int64 peer_id = 6;
}

//--------------------------------------------------------------------------------------------
// inbox.sendUserMessageToInboxV2 flags:# user_id:long from_id:long peer_type:int peer_id:long box_list:Vector<MessageBox> users:flags.1?Vector<User> chats:flags.2?Vector<Chat> = Void;
message TL_inbox_sendUserMessageToInboxV2 {
