Name: messenger.msg
ListenOn: 127.0.0.1:20030
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: messenger.msg
Mysql:
  Addr: 127.0.0.1:3306
  DSN: root:@tcp(127.0.0.1:3306)/teamgram?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai&innodb_lock_wait_timeout=2
  Active: 64
  Idle: 64
  IdleTimeout: 4h
  QueryTimeout: 5s
  ExecTimeout: 5s
  TranTimeout: 5s

# Events of box transactions: rows of mq_outbox, published by the relay
# (ADR 0012). Kafka is not needed to start.
Topics:
  Inbox: "Inbox-T"
  Sync: "Sync-T"

Relay:
  Brokers:
    - 127.0.0.1:9092
  Groups:
    - Topic: "Inbox-T"
      Group: "Inbox-MainCommunity-S"
    - Topic: "Sync-T"
      Group: "Sync-MainCommunity-S"

InboxConsumer:
  Brokers:
    - 127.0.0.1:9092
  Topic: "Inbox-T"
  Group: "Inbox-MainCommunity-S"

IdgenClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.idgen
BizServiceClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service
