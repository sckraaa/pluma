// ContentMessage <--
//  + TL_contentMessage
//
message ContentMessage {
  string predicate_name = 1;
  TLConstructor constructor = 2;
  int32 id = 3;
  int64 dialog_message_id = 4;
  bool mentioned = 5;
  bool media_unread = 6;
  bool reaction = 7;
  int64 send_user_id = 8;
}

message TL_contentMessage {
  ContentMessage data2 = 1;
}

// OutboxMessage <--
//  + TL_outboxMessage
//
message OutboxMessage {
  string predicate_name = 1;
  TLConstructor constructor = 2;
  bool no_webpage = 3;
  bool background = 4;
  int64 random_id = 5;
  mtproto.Message message = 6;
  google.protobuf.Int32Value schedule_date = 7;
}

message TL_outboxMessage {
  OutboxMessage data2 = 1;
}

// Sender <--
//  + TL_sender
//
message Sender {
  string predicate_name = 1;
  TLConstructor constructor = 2;
  int64 user_id = 3;
  int32 type = 4;
  int64 auth_key_id = 5;
}

message TL_sender {
  Sender data2 = 1;
}

