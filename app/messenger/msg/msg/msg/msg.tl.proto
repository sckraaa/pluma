//--------------------------------------------------------------------------------------------
// pluma: msg.editPeerFolders user_id:long auth_key_id:long peers:Vector<long> folder_id:int = Updates;
// Moves the dialogs peers (peer dialog ids) of the user to the peer folder
// folder_id, the archive (1) or the main list (0), task 050.
message TL_msg_editPeerFolders {
  TLConstructor constructor = 1;
  int64 user_id = 3;
  int64 auth_key_id = 4;
  repeated int64 peers = 5;
  int32 folder_id = 6;
}

//--------------------------------------------------------------------------------------------
// pluma: msg.sendReaction user_id:long auth_key_id:long peer_type:int peer_id:long msg_id:int big:Bool add_to_recent:Bool reaction:Vector<Reaction> = Updates;
// Sets the reactions of the user to its copy msg_id of a message of a
// private chat or a basic group: the whole list, in the user's order;
// empty takes them back (task 053).
message TL_msg_sendReaction {
  TLConstructor constructor = 1;
  int64 user_id = 3;
  int64 auth_key_id = 4;
  int32 peer_type = 5;
  int64 peer_id = 6;
  int32 msg_id = 7;
  mtproto.Bool big = 8;
  mtproto.Bool add_to_recent = 9;
  repeated mtproto.Reaction reaction = 10;
}

