  rpc msg_editMessageV2(TL_msg_editMessageV2) returns (mtproto.Updates) {}
  rpc msg_deleteMessages(TL_msg_deleteMessages)
      returns (mtproto.messages_AffectedMessages) {}
  rpc msg_deleteHistory(TL_msg_deleteHistory)
      returns (mtproto.messages_AffectedHistory) {}
  rpc msg_deletePhoneCallHistory(TL_msg_deletePhoneCallHistory)
      returns (mtproto.messages_AffectedFoundMessages) {}
  rpc msg_deleteChatHistory(TL_msg_deleteChatHistory) returns (mtproto.Bool) {}
  rpc msg_readHistoryV2(TL_msg_readHistoryV2)
      returns (mtproto.messages_AffectedMessages) {}
