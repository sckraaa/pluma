Name: interface.gateway
ListenOn: 127.0.0.1:20110
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: interface.gateway
RSAKey:
  - KeyFile: "../../secrets/server_pkcs1.key"
    KeyFingerprint: "${SERVER_RSA_KEY_FINGERPRINT}"
MaxProc: 4
Server:
  Addrs:
    - 0.0.0.0:10443
    - 0.0.0.0:5222
    - 0.0.0.0:8801
  SendBuf: 65536
  ReceiveBuf: 65536
  Multicore: false
Session:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: interface.session
