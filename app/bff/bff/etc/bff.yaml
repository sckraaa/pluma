Name: bff.bff
ListenOn: 127.0.0.1:20010
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: bff.bff
Log:
  Mode: file
  Path: ../logs/bff
KV:
  - Host: localhost:6379

# Phone allowlist (closed registration): table phone_allowlist,
# managed with tools/pluma-admin. See docs/ops/security-setup.md.
Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(127.0.0.1:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 8
  Idle: 4
  IdleTimeout: 4h

# Login codes: random, stored in Redis only as HMAC-SHA256 under this key;
# delivered in the app or issued by `pluma-admin login-code`. There is no SMS
# provider. One account may have a fixed code, for the App Store reviewers
# (LOGIN_REVIEW_PHONE, LOGIN_REVIEW_CODE; both empty: none).
LoginCode:
  HmacKey: "${LOGIN_CODE_HMAC_KEY}"
  ReviewPhone: "${LOGIN_REVIEW_PHONE}"
  ReviewCode: "${LOGIN_REVIEW_CODE}"

# The recovery email of the cloud password (task 091, ADR 0058,
# docs/ops/email.md): the codes go out through Resend with a key that may
# only send from the domain of MAIL_FROM. No key: the recovery email is off
# (has_recovery is false, a forgotten password is reset after 7 days or by
# pluma-admin password reset). The codes are HMACs under
# LOGIN_CODE_HMAC_KEY. DailyLimit caps the emails of the whole server in a
# UTC day (80 by default, below the 100 of Resend's free plan).
Mail:
  Provider: resend
  ApiKey: "${MAIL_API_KEY}"
  From: "${MAIL_FROM}"

# The translation of messages (task 101, ADR 0064, docs/ops/translation.md):
# the engine is a service with POST /v1/chat/completions of the OpenAI API,
# the translate service of docker-compose.translate.yaml or any other. No
# URL: the translation is off, and the clients are told so by the keys
# translations_manual_enabled and translations_auto_enabled. Model names the
# model the engine serves; Profile the prompts of the model (hy-mt1.5 by
# default). Slots and Context are the engine's --parallel and --ctx-size
# (4 and 16384 by default) and are set here when the engine's differ; the
# waits, the bounds of a request and the per-user limits have defaults too.
Translate:
  URL: "${TRANSLATE_URL}"
  Token: "${TRANSLATE_TOKEN}"
  Model: "${TRANSLATE_MODEL}"
  Profile: "${TRANSLATE_PROFILE}"

# upload.getWebFile (task 099, ADR 0062, p. 5, docs/ops/inline-bots.md):
# the thumbnails and content inline bots name by address are handed out
# signed under WEBFILE_HMAC_KEY and fetched by the server, never by the
# device. No key: they go out unsigned (webDocumentNoProxy) and clients
# fetch them from the bot's host themselves. CacheDir and CacheBytes (by
# default /tmp/webfile and 2 GiB) bound the files kept for 24 hours.
WebFile:
  HMACKey: "${WEBFILE_HMAC_KEY}"

# The built-in inline bots @gif and @pic (task 099, ADR 0062,
# docs/ops/inline-bots.md). @pic searches pictures with the SearXNG of
# SEARXNG_URL (http://searxng:8080 in Docker; empty: @pic answers with empty
# lists). The media they find are imported into dfs when a query finds
# them, at most INLINE_IMPORT_DAILY_BYTES a UTC day (empty: 1 GiB); past
# it only media imported before are shown.
InlineBots:
  SearxngURL: "${SEARXNG_URL}"
  ImportDailyBytes: "${INLINE_IMPORT_DAILY_BYTES}"

# The bot platform (task 106, ADR 0068, docs/ops/bots.md). WebApp: the
# tgWebAppVersion given to a mini app by the platform of the client that
# opens it, and WEBAPP_SIGNING_KEY, the Ed25519 seed (hex) of the signature
# of initData; without it no mini app opens. BotSecrets: the keys of bots
# derived from their tokens are sealed under BOT_SECRET_ENCRYPTION_KEY
# (pkg/botkeys); without it no keys are stored, and the mini apps and the
# login of bots are off. Avatars: the public photos of users by username
# (ADR 0036, p. 4), the photo_url bots are given.
WebApp:
  Versions:
    Android: "8.0"
    IOS: "8.0"
    MacOS: "8.0"
    TDesktop: "8.0"
    Web: "8.0"
    WebA: "8.0"
    WebK: "8.0"
    Unknown: "8.0"
  SigningKey: "${WEBAPP_SIGNING_KEY}"
BotSecrets:
  EncryptionKey: "${BOT_SECRET_ENCRYPTION_KEY}"
Avatars: https://pluma.chat/_l/avatar/

# Seals the secrets of push devices (pkg/pushdevices, task 009).
PushSecretEncryptionKey: "${PUSH_SECRET_ENCRYPTION_KEY}"

BizServiceClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service
  # Covers the box transactions of dialog (checked at start).
  Timeout: 30000
AuthSessionClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.media
IdgenClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: messenger.msg
DfsClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.dfs
StatusClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.status

# Pushes are rows of mq_outbox in the database of Mysql (ADR 0012).
SyncClient:
  Topic: "Sync-T"

# Group calls (task 093) are off without SFU nodes; GroupCalls in
# teamgramd/etc/bff.yaml and docs/ops/group-calls.md show how to name one.
