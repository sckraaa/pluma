Name: bff.bff
ListenOn: 127.0.0.1:20010
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: bff.bff
Log:
  Mode: file
  Path: ../logs/bff
KV:
  - Host: localhost:6379

# Phone allowlist (closed registration): table phone_allowlist,
# managed with tools/pluma-admin. See docs/ops/security-setup.md.
Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(127.0.0.1:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 8
  Idle: 4
  IdleTimeout: 4h

# Login codes: random, stored in Redis only as HMAC-SHA256 under this key;
# delivered in the app or issued by `pluma-admin login-code`. There is no SMS
# provider. One account may have a fixed code, for the App Store reviewers
# (LOGIN_REVIEW_PHONE, LOGIN_REVIEW_CODE; both empty: none).
LoginCode:
  HmacKey: "${LOGIN_CODE_HMAC_KEY}"
  ReviewPhone: "${LOGIN_REVIEW_PHONE}"
  ReviewCode: "${LOGIN_REVIEW_CODE}"

# The recovery email of the cloud password (task 091, ADR 0058,
# docs/ops/email.md): the codes go out through Resend with a key that may
# only send from the domain of MAIL_FROM. No key: the recovery email is off
# (has_recovery is false, a forgotten password is reset after 7 days or by
# pluma-admin password reset). The codes are HMACs under
# LOGIN_CODE_HMAC_KEY. DailyLimit caps the emails of the whole server in a
# UTC day (80 by default, below the 100 of Resend's free plan).
Mail:
  Provider: resend
  ApiKey: "${MAIL_API_KEY}"
  From: "${MAIL_FROM}"

# Seals the secrets of push devices (pkg/pushdevices, task 009).
PushSecretEncryptionKey: "${PUSH_SECRET_ENCRYPTION_KEY}"

BizServiceClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service
  # Covers the box transactions of dialog (checked at start).
  Timeout: 30000
AuthSessionClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.media
IdgenClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: messenger.msg
DfsClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.dfs
StatusClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.status

# Pushes are rows of mq_outbox in the database of Mysql (ADR 0012).
SyncClient:
  Topic: "Sync-T"

# Group calls (task 093) are off without SFU nodes; GroupCalls in
# teamgramd/etc/bff.yaml and docs/ops/group-calls.md show how to name one.
