<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131513" media="(prefers-color-scheme: dark)">
<title>Pluma · панель</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="mark.svg" type="image/svg+xml">
</head>
<body>
<div class="shell" id="shell">
  <aside class="rail" id="rail" aria-label="Разделы панели">
    <a class="brand" href="#overview"><img src="mark.svg" alt="" width="24" height="24"><span>Pluma</span></a>
    <nav id="nav" hidden></nav>
    <div class="rail-foot" id="foot" hidden>
      <span class="who" id="who"></span>
      <button class="link" id="logout" type="button">Выйти</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop" hidden></div>
  <div class="column">
    <header class="top">
      <button class="iconbtn" id="menu" type="button" aria-label="Открыть разделы" aria-expanded="false" aria-controls="rail">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
      </button>
      <h1 id="title"></h1>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
