# Upstreams of Pluma for the owner's nginx stream on 443 (task 109,
# docs/ops/ru-node.md), installed as /etc/nginx/stream.d/pluma-upstreams.conf
# by owner-nginx.sh install. The owner's stream server sends PROXY v1 to
# every upstream (proxy_protocol on), so both get the client's address.
#
# The edge: Caddy at home on the address of the tunnel (10.78.0.2:8443,
# docker-compose.ru.yaml), which takes PROXY only from 10.78.0.1.
upstream pluma_ru_edge {
    server 10.78.0.2:8443;
}

# Delivery 202: the nginx of Pluma on this node (files.conf.tmpl).
upstream pluma_ru_files {
    server 127.0.0.1:9443;
}
