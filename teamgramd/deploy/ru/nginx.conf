# The nginx of Pluma on the Russian node (task 109, ADR 0072 §8,
# docs/ops/ru-node.md): delivery 202 of large files. It is an instance of
# its own (pluma-ru-nginx.service, nginx -c /etc/pluma-ru/nginx.conf) of the
# owner's Ubuntu package, so that a deploy of Pluma never reloads the
# owner's nginx and the owner's changes never reach this one.
#
# - Relative paths are relative to the directory of this file: deploy.sh
#   checks a new set of files (nginx -t) in a directory of its own before it
#   puts them here.
# - No include of /etc/nginx/modules-enabled: nothing here needs a dynamic
#   module (secure_link and slice are built in, owner-nginx.sh check reads
#   nginx -V).
# - Every temporary directory is our own: nginx creates and chowns them to
#   the worker user at start, and the defaults are the owner's
#   /var/lib/nginx.
# - No access log; errors go to the journal of the unit.
user pluma-ru;
worker_processes auto;
worker_rlimit_nofile 16384;
# Straight in /run, not in a RuntimeDirectory of the unit: nginx -t opens
# the pid file, and deploy.sh checks a new set while the service may be
# stopped.
pid /run/pluma-ru-nginx.pid;
error_log stderr warn;

events {
	worker_connections 4096;
}

http {
	default_type application/octet-stream;
	server_tokens off;
	access_log off;

	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65s;
	client_header_timeout 15s;
	client_body_timeout 15s;
	send_timeout 30s;
	# Only GET, HEAD and OPTIONS are served: a request never has a body.
	client_max_body_size 1k;

	client_body_temp_path /var/lib/pluma-ru/nginx/body;
	proxy_temp_path /var/lib/pluma-ru/nginx/proxy;
	fastcgi_temp_path /var/lib/pluma-ru/nginx/fastcgi;
	uwsgi_temp_path /var/lib/pluma-ru/nginx/uwsgi;
	scgi_temp_path /var/lib/pluma-ru/nginx/scgi;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:pluma_ru_tls:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	# $pluma_token_key and $pluma_origin_auth, written by deploy.sh from
	# /etc/pluma-ru/env (0600): never in the repository.
	include secrets.conf;
	# The server of delivery 202, from files.conf.tmpl.
	include files.conf;
}
