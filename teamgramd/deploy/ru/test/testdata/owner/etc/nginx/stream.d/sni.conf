# Port 443 is shared by name (SNI) without decrypting: the owner's site goes
# to the local nginx on 127.0.0.1:8443 with the client address in PROXY
# protocol; names of other services are added to the map.
map $ssl_preread_server_name $sni_upstream {
    default owner_site;
}
upstream owner_site {
    server 127.0.0.1:8443;
}
server {
    listen 443;
    ssl_preread on;
    proxy_pass $sni_upstream;
    proxy_protocol on;
    proxy_connect_timeout 10s;
}
