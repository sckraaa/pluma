# A CDN node in Docker (task 102, ADR 0065, docs/ops/cdn.md). Mounted over
# the image's own configuration; every ${VAR} must be set.
#
#   CDN_DC_ID        the CDN DC, as CDN_DC_ID at the home (201)
#   CDN_SECRET       "dd" and 32 hex digits, as CDN_DC_SECRET at the home
#   CDN_CACHE_BYTES  the disk the files may fill: at most the free space of
#                    the volume less 5 GB
#   CDN_IDLE_TTL     a file not served for that long is dropped (720h)
Log:
  ServiceName: cdn
  Mode: console
  Level: info

DcId: ${CDN_DC_ID}

MTProto:
  # The port inside the container; the published one is CDN_PORT.
  ListenOn: 0.0.0.0:8443
  Secret: "${CDN_SECRET}"
  MaxAuthKeys: 20000
  MaxConnsPerIP: 32
  KeyExchangesPerIPMinute: 300
  MaxInFlight: 16
  IdleTimeout: 5m

Store:
  # The volume of the node (PLUMA_CDN_DATA on the host).
  DataDir: /var/lib/cdn
  CacheBytes: ${CDN_CACHE_BYTES}
  IdleTTL: ${CDN_IDLE_TTL}
  DiskReserveBytes: 2147483648

Control:
  # Published on the tunnel address only (10.77.0.1:20510).
  ListenOn: 0.0.0.0:20510
  CertFile: /run/secrets/cdn/server.pem
  KeyFile: /run/secrets/cdn/server-key.pem
  ClientCAFile: /run/secrets/cdn/client-ca.pem

# Read by Prometheus at home over the tunnel (10.77.0.1:20511).
MetricsListenOn: 0.0.0.0:20511
