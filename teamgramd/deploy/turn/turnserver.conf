# STUN and TURN of 1:1 calls (docs/ops/calls.md). The address and the secret
# come on the command line, from docker-compose.turn.yaml.
use-auth-secret
realm=pluma.chat
listening-port=3478
min-port=49160
max-port=49659
fingerprint
no-cli
no-tls
no-dtls
no-tcp-relay
no-multicast-peers
no-software-attribute
log-file=stdout
simple-log
total-quota=400

# A relay reaches only the public internet. The node's own public address
# stays open: the clients relay to relay, so both ends of a relayed call can
# be on this node.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
