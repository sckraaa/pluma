# Garage, the S3 object store of dfs (ADR 0014): one node, one copy.
# Secrets come from the environment: GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN,
# GARAGE_METRICS_TOKEN.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
# A consistent copy of the metadata for the backups (docs/ops/backup.md):
# the live database is not copied, its latest snapshot is.
metadata_auto_snapshot_interval = "1h"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
