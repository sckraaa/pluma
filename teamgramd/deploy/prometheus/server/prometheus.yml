# Minimal Prometheus config for docker-compose-env.yaml. Targets are the
# compose services of docker-compose.yaml (one per process) with the metrics
# ports of their teamgramd/etc2 configs.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules: delivery (ADR 0012, p. 10) and host/services/backups (ADR 0013).
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The optional service of login codes (docker-compose.codes.yaml, task
  # 073): by DNS, so that a server without it has no target and no ServiceDown.
  - job_name: ops.codes
    dns_sd_configs:
      - names: ["codes"]
        type: A
        port: 9378
        refresh_interval: 60s

  # The optional speech recognition service (docker-compose.stt.yaml, task
  # 090): by DNS as well.
  - job_name: ops.stt
    dns_sd_configs:
      - names: ["stt"]
        type: A
        port: 9379
        refresh_interval: 60s

  # The SFU of group calls (docker-compose.sfu.yaml, task 093): by DNS as
  # well. A node on another machine (the edge of task 096) comes from a
  # target file of this host, PLUMA_PROMETHEUS_TARGETS/sfu*.json.
  - job_name: ops.sfu
    dns_sd_configs:
      - names: ["sfu"]
        type: A
        port: 20501
        refresh_interval: 60s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/sfu*.json"]

  - job_name: prometheus
    scrape_interval: 5s  #global catch time
    static_configs:
      - targets: ["localhost:9090"]

  # The host, and the edge's when there is one (target file node*.json,
  # task 096).
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node*.json"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # teamgram 服务 (etc2)
  - job_name: service.authsession
    metrics_path: /metrics
    static_configs:
      - targets: ["authsession:20451"]
        labels:
          job: service.authsession
          app: service.authsession
          env: dev
  - job_name: bff.bff
    metrics_path: /metrics
    static_configs:
      - targets: ["bff:20011"]
        labels:
          job: bff.bff
          app: bff.bff
          env: dev
  - job_name: service.biz_service
    metrics_path: /metrics
    static_configs:
      - targets: ["biz:20021"]
        labels:
          job: service.biz_service
          app: service.biz_service
          env: dev
  - job_name: service.dfs
    metrics_path: /metrics
    static_configs:
      - targets: ["dfs:20641"]
        labels:
          job: service.dfs
          app: service.dfs
          env: dev
  - job_name: interface.gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gnetway:20111"]
        labels:
          job: interface.gateway
          app: interface.gateway
          env: dev
  - job_name: service.idgen
    metrics_path: /metrics
    static_configs:
      - targets: ["idgen:20661"]
        labels:
          job: service.idgen
          app: service.idgen
          env: dev
  - job_name: service.media
    metrics_path: /metrics
    static_configs:
      - targets: ["media:20651"]
        labels:
          job: service.media
          app: service.media
          env: dev
  - job_name: messenger.msg
    metrics_path: /metrics
    static_configs:
      - targets: ["msg:20031"]
        labels:
          job: messenger.msg
          app: messenger.msg
          env: dev
  - job_name: interface.session
    metrics_path: /metrics
    static_configs:
      - targets: ["session:20121"]
        labels:
          job: interface.session
          app: interface.session
          env: dev
  - job_name: service.status
    metrics_path: /metrics
    static_configs:
      - targets: ["status:20671"]
        labels:
          job: service.status
          app: service.status
          env: dev
  - job_name: messenger.sync
    metrics_path: /metrics
    static_configs:
      - targets: ["sync:20421"]
        labels:
          job: messenger.sync
          app: messenger.sync
          env: dev
  - job_name: messenger.push
    metrics_path: /metrics
    static_configs:
      - targets: ["push:20461"]
        labels:
          job: messenger.push
          app: messenger.push
          env: dev
