  #       labels:
  #         job: interface.httpserver
  #         app: interface.httpserver
  #         env: dev
  - job_name: service.idgen
    metrics_path: /metrics
    static_configs:
      - targets: ["idgen:20661"]
        labels:
          job: service.idgen
          app: service.idgen
          env: dev
  - job_name: service.media
    metrics_path: /metrics
    static_configs:
      - targets: ["media:20651"]
        labels:
          job: service.media
