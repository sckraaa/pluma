# Minimal Prometheus config for docker-compose-env.yaml. Targets are the
# compose services of docker-compose.yaml (one per process) with the metrics
# ports of their teamgramd/etc2 configs.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Delivery alerts (ADR 0012, p. 10). Notifications (Alertmanager) are task 004.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    scrape_interval: 5s  #global catch time
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # teamgram 服务 (etc2)
  - job_name: service.authsession
    metrics_path: /metrics
    static_configs:
      - targets: ["authsession:20451"]
        labels:
          job: service.authsession
          app: service.authsession
          env: dev
  - job_name: bff.bff
    metrics_path: /metrics
    static_configs:
      - targets: ["bff:20011"]
        labels:
          job: bff.bff
          app: bff.bff
          env: dev
  - job_name: service.biz_service
    metrics_path: /metrics
    static_configs:
      - targets: ["biz:20021"]
        labels:
          job: service.biz_service
          app: service.biz_service
          env: dev
  - job_name: service.dfs
    metrics_path: /metrics
    static_configs:
      - targets: ["dfs:20641"]
        labels:
          job: service.dfs
          app: service.dfs
          env: dev
  - job_name: interface.gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gnetway:20111"]
        labels:
          job: interface.gateway
          app: interface.gateway
          env: dev
  # - job_name: interface.httpserver
  #   metrics_path: /metrics
  #   static_configs:
