# Login codes sent from the Telegram account (task 073, ADR 0044,
# docs/ops/login-codes.md). The service is optional: when it is not deployed
# Prometheus finds no target (dns_sd) and none of these fire.
groups:
  - name: codes
    rules:
      - alert: LoginCodesSessionGone
        expr: codes_session_ready == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "The Telegram account of the login codes has no session"
          description: "Telegram ended the session, or it was never logged in. Codes go only through the administrator until codes login is repeated. docs/ops/login-codes.md"

      - alert: LoginCodesAccountLimited
        expr: codes_account_limited == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Telegram limits the account of the login codes"
          description: "A flood wait or a restriction: codes go through the administrator meanwhile. docs/ops/login-codes.md"

      - alert: LoginCodesSenderUnreachable
        expr: sum(increase(login_code_sender_total{result="error"}[15m])) > 2
        labels: {severity: warning}
        annotations:
          summary: "bff cannot reach the service of the login codes"
          description: "Codes go through the administrator. docker compose ps codes; docs/ops/login-codes.md"

      - alert: LoginCodesContactsNotRemoved
        expr: codes_contacts_to_remove > 5
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Imported contacts are not being removed from the account"

  # The recovery email of the cloud password (task 091, ADR 0058, p. 12,
  # docs/ops/email.md): the emails with its codes that bff hands to Resend.
  # Without MAIL_API_KEY nothing is sent and none of these fire.
  - name: password_email
    rules:
      - alert: PasswordEmailSenderFailing
        expr: sum(increase(password_email_send_total{result=~"retryable|permanent"}[15m])) > 2
        labels: {severity: warning}
        annotations:
          summary: "Resend does not take the emails of the recovery email"
          description: "Recovery codes do not reach users; they get FLOOD_WAIT_60. Lines 'twofa: ... was not sent' in the log of bff; docs/ops/email.md"

      - alert: PasswordEmailSenderRejected
        expr: sum(increase(password_email_send_total{result="permanent"}[1h])) > 0
        labels: {severity: warning}
        annotations:
          summary: "Resend refuses the emails of the recovery email"
          description: "A revoked key, an unverified domain or the month's quota used up: the code of the error is in the log of bff. docs/ops/email.md"

      - alert: PasswordEmailBruteForce
        expr: sum(increase(password_email_code_total{result="invalid"}[1h])) > 20
        labels: {severity: warning}
        annotations:
          summary: "Many wrong codes of the recovery email"
          description: "Someone may be guessing recovery codes; 'possible brute force' in the log of bff names the user. docs/ops/email.md"

  # The built-in inline bots @gif and @pic (task 099, ADR 0062,
  # docs/ops/inline-bots.md): the metrics bff bots exports for the queries
  # the shared cache did not answer, the imports of media into dfs and the
  # check of the bots' accounts against the registry.
  - name: inline_bots
    rules:
      # A provider that fails answers empty lists (cache_time 0): clients show
      # "nothing found", nothing else tells. "error" is a provider that failed
      # or a page with nothing ready within 7 s; "empty" (nothing found, or
      # @pic without SEARXNG_URL) and "limited" are not failures. At least 3
      # errors, so that one failed query at night does not page.
      - alert: InlineProviderFailing
        expr: |
          (
            sum by (bot) (increase(inline_builtin_requests_total{result="error"}[15m]))
              / sum by (bot) (increase(inline_builtin_requests_total{result=~"ok|empty|error"}[15m]))
          ) > 0.5
          and sum by (bot) (increase(inline_builtin_requests_total{result="error"}[15m])) >= 3
        labels: {severity: warning}
        annotations:
          summary: "@{{ $labels.bot }} fails more than half of its queries"
          description: "Users get empty lists. @pic: SearXNG is down or every image engine blocks the address (docker compose logs searxng); @gif: KLIPY fails or limits the key (inline_klipy_requests_total), or MySQL or media without KLIPY. Lines 'messages.getInlineBotResults - @{{ $labels.bot }}' in the log of bff. docs/ops/inline-bots.md"

      # KLIPY refuses the app key of @gif (401 or 403): the key is wrong,
      # revoked or not yet active, and @gif answers every query with an
      # empty list. One refusal is enough: it does not pass by itself.
      - alert: InlineKlipyKeyRefused
        expr: sum(increase(inline_klipy_requests_total{result="refused"}[15m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "KLIPY refuses the app key of @gif"
          description: "@gif answers with empty lists. Check KLIPY_API_KEY in .env against the KLIPY Partner Panel and restart bff. docs/ops/inline-bots.md, «KLIPY»"

      # The gauge is 1 while the account of a bot does not match the registry
      # (pkg/inlinebots): the bot answers BOT_INLINE_DISABLED. bff checks again
      # every minute, so a repaired account clears it without a restart.
      - alert: InlineBotMisconfigured
        expr: max by (bot) (inline_bot_misconfigured) == 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "@{{ $labels.bot }} is not served: its account does not match the registry"
          description: "Usually its username is taken by a person or a channel, or z_pluma-inline-bots.sql did not run. The reason is in the line 'inlinebots: @{{ $labels.bot }} is not served' of the log of bff. docs/ops/inline-bots.md, «Если имя бота занято»"

      # The import budget (INLINE_IMPORT_DAILY_BYTES, 1 GiB a UTC day by
      # default) refuses imports: only media imported before are shown. Spent
      # late in the day is the budget working; spent before 18:00 UTC is a
      # day of unusual use, or a budget too small. The first 15 minutes of a
      # day are left out: the window still holds the refusals of the day
      # before, whose budget is gone at 00:00.
      - alert: InlineImportBudgetSpent
        expr: |
          sum(increase(inline_import_total{result="budget"}[15m])) > 0
          and on() hour() < 18
          and on() (hour() * 60 + minute()) >= 15
        labels: {severity: warning}
        annotations:
          summary: "The day's import budget of @gif and @pic is spent before 18:00 UTC"
          description: "New pictures are not imported until 00:00 UTC; @pic answers with what was imported before. Check inline_import_bytes_total by kind and docs/ops/inline-bots.md, «Бюджет импорта», before raising INLINE_IMPORT_DAILY_BYTES."
