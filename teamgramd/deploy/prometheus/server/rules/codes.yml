# Login codes sent from the Telegram account (task 073, ADR 0044,
# docs/ops/login-codes.md). The service is optional: when it is not deployed
# Prometheus finds no target (dns_sd) and none of these fire.
groups:
  - name: codes
    rules:
      - alert: LoginCodesSessionGone
        expr: codes_session_ready == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "The Telegram account of the login codes has no session"
          description: "Telegram ended the session, or it was never logged in. Codes go only through the administrator until codes login is repeated. docs/ops/login-codes.md"

      - alert: LoginCodesAccountLimited
        expr: codes_account_limited == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Telegram limits the account of the login codes"
          description: "A flood wait or a restriction: codes go through the administrator meanwhile. docs/ops/login-codes.md"

      - alert: LoginCodesSenderUnreachable
        expr: sum(increase(login_code_sender_total{result="error"}[15m])) > 2
        labels: {severity: warning}
        annotations:
          summary: "bff cannot reach the service of the login codes"
          description: "Codes go through the administrator. docker compose ps codes; docs/ops/login-codes.md"

      - alert: LoginCodesContactsNotRemoved
        expr: codes_contacts_to_remove > 5
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Imported contacts are not being removed from the account"

  # The recovery email of the cloud password (task 091, ADR 0058, p. 12,
  # docs/ops/email.md): the emails with its codes that bff hands to Resend.
  # Without MAIL_API_KEY nothing is sent and none of these fire.
  - name: password_email
    rules:
      - alert: PasswordEmailSenderFailing
        expr: sum(increase(password_email_send_total{result=~"retryable|permanent"}[15m])) > 2
        labels: {severity: warning}
        annotations:
          summary: "Resend does not take the emails of the recovery email"
          description: "Recovery codes do not reach users; they get FLOOD_WAIT_60. Lines 'twofa: ... was not sent' in the log of bff; docs/ops/email.md"

      - alert: PasswordEmailSenderRejected
        expr: sum(increase(password_email_send_total{result="permanent"}[1h])) > 0
        labels: {severity: warning}
        annotations:
          summary: "Resend refuses the emails of the recovery email"
          description: "A revoked key, an unverified domain or the month's quota used up: the code of the error is in the log of bff. docs/ops/email.md"

      - alert: PasswordEmailBruteForce
        expr: sum(increase(password_email_code_total{result="invalid"}[1h])) > 20
        labels: {severity: warning}
        annotations:
          summary: "Many wrong codes of the recovery email"
          description: "Someone may be guessing recovery codes; 'possible brute force' in the log of bff names the user. docs/ops/email.md"
