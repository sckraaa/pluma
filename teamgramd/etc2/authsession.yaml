Name: service.authsession
ListenOn: 0.0.0.0:20450
Etcd:
  Hosts:
    - etcd:2379
  Key: service.authsession
Log:
  ServiceName: service.authsession
  #Mode: file
  #Path: ../logs/authsession
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20451
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.authsession
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 32
  Idle: 32
  IdleTimeout: 4h
  
Cache:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"
KV:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"

# Seals the auth keys at rest (task 008, pkg/authkeys): the hex of 32 random
# bytes, kept outside the database. Without it authsession does not start;
# with another one it cannot read the stored keys. See
# docs/ops/security-setup.md.
AuthKeyEncryptionKey: "${AUTH_KEY_ENCRYPTION_KEY}"

# The GeoIP database (DB-IP Lite City, MMDB) that gives the place of a
# session in Devices and in the New login message. docker-compose.yaml mounts
# the host's geoip directory here read-only. Without the file authsession
# runs on, logs an error at start, and every place is UNKNOWN. See
# docs/ops/deployment.md, "GeoIP (DB-IP Lite)".
GeoIPDatabase: /app/geoip/dbip-city-lite.mmdb
