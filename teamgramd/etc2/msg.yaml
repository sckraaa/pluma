Name: messenger.msg
ListenOn: 0.0.0.0:20030
Etcd:
  Hosts:
    - etcd:2379
  Key: messenger.msg
Timeout: 40000
Log:
  ServiceName: messenger.msg
  #Mode: file
  #Path: ../logs/msg
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20031
  Path: /metrics
#链路追踪
Telemetry:
  Name: messenger.msg
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true&innodb_lock_wait_timeout=2"
  Active: 64
  Idle: 64
  IdleTimeout: 4h
Cache:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"

# Events of box transactions: rows of mq_outbox, published by the relay
# (ADR 0012). Kafka is not needed to start.
Topics:
  Inbox: "Inbox-T"
  Sync: "Sync-T"

Relay:
  Brokers:
    - kafka:9092
  Groups:
    - Topic: "Inbox-T"
      Group: "Inbox-MainCommunity-S"
    - Topic: "Sync-T"
      Group: "Sync-MainCommunity-S"

InboxConsumer:
  Brokers:
    - kafka:9092
  Topic: "Inbox-T"
  Group: "Inbox-MainCommunity-S"

IdgenClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen

BizServiceClient:
  Timeout: 5000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
