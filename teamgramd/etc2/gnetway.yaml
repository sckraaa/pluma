Name: interface.gateway
ListenOn: 0.0.0.0:20110
Etcd:
  Hosts:
    - etcd:2379
  Key: interface.gateway
Log:
  ServiceName: interface.gateway
  #Mode: file
  #Path: ../logs/gnetway
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20111
  Path: /metrics
#链路追踪
Telemetry:
  Name: interface.gateway
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
# MTProto server RSA keys (docs/ops/security-setup.md). Generate with
# tools/genserverkey; the file must not be accessible by other users and must
# match KeyFingerprint, otherwise gnetway refuses to start. List a second key
# here to rotate without breaking clients that still embed the old one.
RSAKey:
  - KeyFile: "/run/secrets/server_pkcs1.key" # compose secret, see docker-compose.yaml
    KeyFingerprint: "${SERVER_RSA_KEY_FINGERPRINT}"
MaxProc: 4

Gnetway:
  Server:
    - Proto: tcp
      Addresses:
        - 0.0.0.0:10443
        - 0.0.0.0:5222
    - Proto: websocket
      Addresses:
        - 0.0.0.0:11443
  Multicore: false
  SendBuf: 65536
  ReceiveBuf: 65536

Session:
  Etcd:
    Hosts:
      - etcd:2379
    Key: interface.session
