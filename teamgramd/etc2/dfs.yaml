Name: service.dfs
ListenOn: 0.0.0.0:20640
Etcd:
  Hosts:
    - etcd:2379
  Key: service.dfs
Timeout: 120000
Log:
  ServiceName: service.dfs
  #Mode: file
  #Path: ../logs/dfs
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20641
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.dfs
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
# Serves uploaded files to dfs's own ffmpeg (http://127.0.0.1:11701), without
# authentication: loopback only. No timeout: ffmpeg reads while it transcodes.
MiniHttp:
  Name: service.dfs.minihttp
  Host: 127.0.0.1
  Port: 11701
  Timeout: 120000
Cache:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"
Minio:
  Endpoint: garage:3900
  AccessKeyID: "${S3_ACCESS_KEY_ID}"
  SecretAccessKey: "${S3_SECRET_ACCESS_KEY}"
  UseSSL: false
  Region: garage
  Bucket:
    Documents: documents
    Photos: photos
    Videos: videos
    EncryptedFiles: encryptedfiles
IdGen:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
SSDB:
  - Host: redis:6379 # if use pika, change to 9221
    Pass: "${REDIS_PASSWORD}"
