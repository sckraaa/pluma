Name: bff.bff
ListenOn: 0.0.0.0:20010
Etcd:
  Hosts:
    - etcd:2379
  Key: bff.bff
Timeout: 150000
Log:
  ServiceName: bff.bff
  #Mode: file
  #Path: ../logs/bff
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: bff.bff
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
KV:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"

# Phone allowlist (closed registration): table phone_allowlist,
# managed with tools/pluma-admin. See docs/ops/security-setup.md.
Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 8
  Idle: 4
  IdleTimeout: 4h

# Login codes: random, stored in Redis only as HMAC-SHA256 under this key;
# delivered in the app or issued by `pluma-admin login-code`. There is no SMS
# provider. One account may have a fixed code, for the App Store reviewers
# (LOGIN_REVIEW_PHONE, LOGIN_REVIEW_CODE; both empty: none).
LoginCode:
  HmacKey: "${LOGIN_CODE_HMAC_KEY}"
  ReviewPhone: "${LOGIN_REVIEW_PHONE}"
  ReviewCode: "${LOGIN_REVIEW_CODE}"
  # The service that writes codes from a Telegram account
  # (docs/ops/login-codes.md); no URL: no such service.
  SenderURL: "${LOGIN_CODES_SENDER_URL}"
  SenderToken: "${LOGIN_CODES_SENDER_TOKEN}"

# The bot that fetches sticker and emoji sets from Telegram when a user asks
# for one the server lacks (task 030, docs/ops/catalog.md); all three
# empty: no bot, and such a set is STICKERSET_INVALID.
TelegramBot:
  ApiId: "${TELEGRAM_API_ID}"
  ApiHash: "${TELEGRAM_API_HASH}"
  BotToken: "${TELEGRAM_BOT_TOKEN}"

# The site the releases of the client apps are on (task 054, ADR 0035):
# /dl/ of it serves them; help.getAppUpdate and help.getConfig name it.
# Empty: no update is offered.
ReleasesURL: "${PLUMA_RELEASES_URL}"

# The update of the iPhone app from the app itself (task 085,
# docs/ops/ios-install.md): the secret of the update tickets, the same the
# install service gets, and where that service tells which build it gives.
# Empty secret: an Ad Hoc build is offered the site's install page.
IOSUpdate:
  Secret: "${PLUMA_IOS_UPDATE_SECRET}"
  StatusURL: "http://iosinstall:9098/internal/update"

# The recovery email of the cloud password (task 091, ADR 0058,
# docs/ops/email.md): the codes go out through Resend with a key that may
# only send from the domain of MAIL_FROM. No key: the recovery email is off
# (has_recovery is false, a forgotten password is reset after 7 days or by
# pluma-admin password reset). The codes are HMACs under
# LOGIN_CODE_HMAC_KEY. DailyLimit caps the emails of the whole server in a
# UTC day (80 by default, below the 100 of Resend's free plan).
Mail:
  Provider: resend
  ApiKey: "${MAIL_API_KEY}"
  From: "${MAIL_FROM}"

# upload.getWebFile (task 099, ADR 0062, p. 5, docs/ops/inline-bots.md):
# the thumbnails and content inline bots name by address are handed out
# signed under WEBFILE_HMAC_KEY and fetched by the server, never by the
# device. No key: they go out unsigned (webDocumentNoProxy) and clients
# fetch them from the bot's host themselves. CacheDir and CacheBytes (by
# default /tmp/webfile and 2 GiB) bound the files kept for 24 hours.
WebFile:
  HMACKey: "${WEBFILE_HMAC_KEY}"

# The map previews of geo points (task 100, ADR 0063, docs/ops/maps.md),
# which Android, Desktop and Web K ask for with upload.getWebFile: rendered
# by the maps service of docker-compose.maps.yaml (MAPS_URL,
# http://maps:8080 in Docker) and kept in the Redis of KV. No URL: maps are
# off and such a request is LOCATION_INVALID. Empty settings take their
# defaults: the styles ru,en (one per language of the labels), 10s for a
# render, 4 renders at once, 6h in the cache, 60 new maps a minute per user.
# PublicURL (task 112, ADR 0070) is where the clients' interactive maps load
# their tiles, https://<PLUMA_MAPS_DOMAIN>/<MAPS_PUBLIC_KEY>: the maps-tiles
# service behind Caddy, with the styles of Styles and their dark ones; the
# app config hands it out (docs/ops/app-config.md). No URL: the clients get
# no map; a wrong one stops bff.
Maps:
  URL: "${MAPS_URL}"
  Styles: "${MAPS_STYLES}"
  Timeout: "${MAPS_TIMEOUT}"
  Concurrency: "${MAPS_CONCURRENCY}"
  CacheTTL: "${MAPS_CACHE_TTL}"
  PerUserPerMinute: "${MAPS_PER_USER_PER_MINUTE}"
  PublicURL: "${MAPS_PUBLIC_URL}"

# The edges of the patched clients (task 109, ADR 0072, docs/ops/edge.md):
# MTProto in a WebSocket through the CDN (Gcore) or the Russian node, which
# the clients try when the direct address fails. bff hands them pluma_edge
# in help.getAppConfig, picked by the country of the client's address
# (authsession.getIpCountry). EDGE_WS_URLS names the edges,
# "gcore=wss://<prefix>.gcorecdn.com/apiws,ru=wss://ru.pluma.chat/apiws";
# empty: no pluma_edge, and the clients keep the list built into them.
# EDGE_ROUTES, records "<countries or *>:<order>:<edges>" separated by ";",
# e.g. "RU:edge,direct:ru,gcore;*:direct,edge:gcore,ru"; empty: every edge
# to everyone, the direct address first. EDGE_STICKY_S (1800) is how long a
# client keeps to an edge it switched to. A wrong value stops bff.
Edge:
  WSURLs: "${EDGE_WS_URLS}"
  Routes: "${EDGE_ROUTES}"
  StickyS: "${EDGE_STICKY_S}"

# The built-in inline bots @gif and @pic (task 099, ADR 0062,
# docs/ops/inline-bots.md). @pic searches pictures with the SearXNG of
# SEARXNG_URL (http://searxng:8080 in Docker; empty: @pic answers with empty
# lists). @gif searches GIFs with KLIPY with the app key KLIPY_API_KEY
# (empty: @gif has the GIFs popular within the server and no search by
# text). The media they find are imported into dfs when a query finds
# them, at most INLINE_IMPORT_DAILY_BYTES a UTC day (empty: 1 GiB); past
# it only media imported before are shown.
InlineBots:
  SearxngURL: "${SEARXNG_URL}"
  KlipyAPIKey: "${KLIPY_API_KEY}"
  ImportDailyBytes: "${INLINE_IMPORT_DAILY_BYTES}"

# The bot platform (task 106, ADR 0068, docs/ops/bots.md). WebApp: the
# tgWebAppVersion given to a mini app by the platform of the client that
# opens it, and WEBAPP_SIGNING_KEY, the Ed25519 seed (hex) of the signature
# of initData; without it no mini app opens. BotSecrets: the keys of bots
# derived from their tokens are sealed under BOT_SECRET_ENCRYPTION_KEY
# (pkg/botkeys); without it no keys are stored, and the mini apps and the
# login of bots are off. Avatars: the public photos of users by username
# (ADR 0036, p. 4), the photo_url bots are given.
WebApp:
  Versions:
    Android: "8.0"
    IOS: "8.0"
    MacOS: "8.0"
    TDesktop: "8.0"
    Web: "8.0"
    WebA: "8.0"
    WebK: "8.0"
    Unknown: "8.0"
  SigningKey: "${WEBAPP_SIGNING_KEY}"
BotSecrets:
  EncryptionKey: "${BOT_SECRET_ENCRYPTION_KEY}"
Avatars: https://pluma.chat/_l/avatar/

# The statistics of channels and groups (task 103, ADR 0066). ThisDc is
# channelFull.stats_dc, the DC the clients ask for the statistics: this
# server's own, this_dc of teamgramd/bin/config.json. TokenKey signs the
# zoom tokens of the graphs (STATS_GRAPH_TOKEN_KEY, 32 random bytes in
# base64: openssl rand -base64 32); without it the statistics are off and
# the clients do not offer them. Changing it invalidates the zoom tokens
# given out (the clients ask for the statistics again).
Stats:
  ThisDc: 1
  TokenKey: "${STATS_GRAPH_TOKEN_KEY}"

# Seals the secrets of push devices (pkg/pushdevices, task 009).
PushSecretEncryptionKey: "${PUSH_SECRET_ENCRYPTION_KEY}"

BizServiceClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
  # Covers the box transactions of dialog (checked at start).
  Timeout: 30000
AuthSessionClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.media
  Timeout: 120000
IdgenClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: messenger.msg
  Timeout: 45000
DfsClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
  Timeout: 120000
StatusClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.status

# Pushes are rows of mq_outbox in the database of Mysql (ADR 0012).
SyncClient:
  Topic: "Sync-T"

# One-to-one calls (task 068, docs/ops/calls.md): STUN/TURN servers and the
# static-auth-secret of coturn; calls are off without servers.
Calls:
  IceServers: "${CALLS_ICE_SERVERS}"
  TurnSecret: "${CALLS_TURN_SECRET}"
  # The quality parameters of a call (task 077): "pluma" when empty, or
  # "stock", then key=value changes (docs/ops/calls.md).
  Quality: "${CALLS_QUALITY}"

# Group calls of chats and channels (task 093, ADR 0059,
# docs/ops/group-calls.md): the SFU nodes and the client certificate of
# their control API, which is mutual TLS only. No endpoint: group calls are
# off. The overlay docker-compose.sfu.yaml runs the node "main" beside the
# core, sets its endpoint and mounts the certificates; a node on another
# machine is named by GROUPCALLS_SFU_ENDPOINT alone. Name is what the calls'
# table records: it must not change while calls run.
GroupCalls:
  Nodes:
    - Name: main
      Endpoint: "${GROUPCALLS_SFU_ENDPOINT}"
  CertFile: /run/secrets/groupcalls/client.pem
  KeyFile: /run/secrets/groupcalls/client-key.pem
  CAFile: /run/secrets/groupcalls/server-ca.pem
  # Cameras on at once in a call; the node's Limits.MaxVideos.
  VideoLimit: 30

# The HTTPS CDN of large files (task 107, ADR 0071, docs/ops/cdn.md): a file
# of CDN_MIN_FILE_SIZE (1 MiB) and more, a document or a photo, is
# redirected (upload.fileCdnRedirect) to a CDN that pulls its cipher from the
# origin in bff, only for clients that send pluma_cdn in
# initConnection.params. The key, the IV and the hashes stay at home. A
# delivery without BaseURL is off; with none on, the CDN is off and the
# origin does not listen. The keys come from .env only and are never logged.
# Empty values take their defaults: CDN_GCORE_SIGNER gcore-md5 (path-hmac
# when the Secure Token is unavailable), CDN_GCORE_MONTHLY_GB 800,
# CDN_ROUTES *:201, CDN_ORIGIN_LISTEN 0.0.0.0:20480 (the Docker network
# only, published by Caddy), CDN_URL_TTL 6h, CDN_PREPARE_RATE_MBIT 800,
# CDN_KINDS document,photo, CDN_HEALTH_EVERY 1m, CDN_AVOID_TTL 1h.
# CDN_DEV_ALLOW_HTTP=1 (an http:// BaseURL) is for the e2e stand only.
Cdn:
  Deliveries:
    - Id: 201
      Name: gcore
      Signer: "${CDN_GCORE_SIGNER}"
      BaseURL: "${CDN_GCORE_BASE_URL}"
      Key: "${CDN_GCORE_TOKEN_KEY}"
      Source: home-origin
      MonthlyGB: "${CDN_GCORE_MONTHLY_GB}"
  Routes: "${CDN_ROUTES}"
  Origin:
    Listen: "${CDN_ORIGIN_LISTEN}"
    AuthValue: "${CDN_ORIGIN_AUTH}"
    MaxConcurrent: "16"
  UrlTTL: "${CDN_URL_TTL}"
  PrepareRateMbit: "${CDN_PREPARE_RATE_MBIT}"
  MinFileSize: "${CDN_MIN_FILE_SIZE}"
  Kinds: "${CDN_KINDS}"
  DevAllowHTTP: "${CDN_DEV_ALLOW_HTTP}"
  HealthEvery: "${CDN_HEALTH_EVERY}"
  AvoidTTL: "${CDN_AVOID_TTL}"

# Voice transcription (task 090, ADR 0056, docs/ops/transcription.md): the
# speech engine is a service with POST /v1/audio/transcriptions of the OpenAI
# API, app/ops/stt or any other. No URL: transcription is off. Nothing a
# user asks for is refused for its length or number; the settings of the
# queue (Workers, MaxAttempts, FailedTTL, SyncWait, DeliverDelay) have
# defaults and are set here when they must differ.
Transcribe:
  URL: "${STT_URL}"
  Token: "${STT_TOKEN}"
  Model: "${STT_MODEL}"
  Language: "${STT_LANGUAGE}"
  Timeout: "${STT_TIMEOUT}"
# The translation of messages (task 101, ADR 0064, docs/ops/translation.md):
# the engine is a service with POST /v1/chat/completions of the OpenAI API,
# the translate service of docker-compose.translate.yaml or any other. No
# URL: the translation is off, and the clients are told so by the keys
# translations_manual_enabled and translations_auto_enabled. Model names the
# model the engine serves; Profile the prompts of the model (hy-mt1.5 by
# default). Slots and Context are the engine's --parallel and --ctx-size,
# TRANSLATE_SLOTS and TRANSLATE_CTX, which the engine of
# docker-compose.translate.yaml reads too (empty: 4 and 16384); the waits,
# the bounds of a request and the per-user limits have defaults.
Translate:
  URL: "${TRANSLATE_URL}"
  Token: "${TRANSLATE_TOKEN}"
  Model: "${TRANSLATE_MODEL}"
  Profile: "${TRANSLATE_PROFILE}"
  Slots: "${TRANSLATE_SLOTS}"
  Context: "${TRANSLATE_CTX}"
