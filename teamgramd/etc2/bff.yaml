Name: bff.bff
ListenOn: 0.0.0.0:20010
Etcd:
  Hosts:
    - etcd:2379
  Key: bff.bff
Timeout: 0
Log:
  ServiceName: bff.bff
  #Mode: file
  #Path: ../logs/bff
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: bff.bff
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
KV:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"

# Phone allowlist (closed registration): table phone_allowlist,
# managed with tools/pluma-admin. See docs/ops/security-setup.md.
Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 8
  Idle: 4
  IdleTimeout: 4h

# Login codes: random, stored in Redis only as HMAC-SHA256 under this key;
# delivered in the app or issued by `pluma-admin login-code`. There is no SMS
# provider and no fixed code.
LoginCode:
  HmacKey: "${LOGIN_CODE_HMAC_KEY}"

BizServiceClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
  # Covers the box transactions of dialog (checked at start).
  Timeout: 30000
AuthSessionClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.media
  Timeout: 0
IdgenClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: messenger.msg
  Timeout: 0
DfsClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
  Timeout: 0
StatusClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.status

SyncClient:
  Topic:   "Sync-T"
  Brokers:
    - kafka:9092
