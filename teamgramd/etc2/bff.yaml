Name: bff.bff
ListenOn: 0.0.0.0:20010
Etcd:
  Hosts:
    - etcd:2379
  Key: bff.bff
Timeout: 150000
Log:
  ServiceName: bff.bff
  #Mode: file
  #Path: ../logs/bff
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: bff.bff
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
KV:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"

# Phone allowlist (closed registration): table phone_allowlist,
# managed with tools/pluma-admin. See docs/ops/security-setup.md.
Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 8
  Idle: 4
  IdleTimeout: 4h

# Login codes: random, stored in Redis only as HMAC-SHA256 under this key;
# delivered in the app or issued by `pluma-admin login-code`. There is no SMS
# provider. One account may have a fixed code, for the App Store reviewers
# (LOGIN_REVIEW_PHONE, LOGIN_REVIEW_CODE; both empty: none).
LoginCode:
  HmacKey: "${LOGIN_CODE_HMAC_KEY}"
  ReviewPhone: "${LOGIN_REVIEW_PHONE}"
  ReviewCode: "${LOGIN_REVIEW_CODE}"
  # The service that writes codes from a Telegram account
  # (docs/ops/login-codes.md); no URL: no such service.
  SenderURL: "${LOGIN_CODES_SENDER_URL}"
  SenderToken: "${LOGIN_CODES_SENDER_TOKEN}"

# The bot that fetches sticker and emoji sets from Telegram when a user asks
# for one the server lacks (task 030, docs/ops/catalog.md); all three
# empty: no bot, and such a set is STICKERSET_INVALID.
TelegramBot:
  ApiId: "${TELEGRAM_API_ID}"
  ApiHash: "${TELEGRAM_API_HASH}"
  BotToken: "${TELEGRAM_BOT_TOKEN}"

# The site the releases of the client apps are on (task 054, ADR 0035):
# /dl/ of it serves them; help.getAppUpdate and help.getConfig name it.
# Empty: no update is offered.
ReleasesURL: "${PLUMA_RELEASES_URL}"

# The update of the iPhone app from the app itself (task 085,
# docs/ops/ios-install.md): the secret of the update tickets, the same the
# install service gets, and where that service tells which build it gives.
# Empty secret: an Ad Hoc build is offered the site's install page.
IOSUpdate:
  Secret: "${PLUMA_IOS_UPDATE_SECRET}"
  StatusURL: "http://iosinstall:9098/internal/update"

# The recovery email of the cloud password (task 091, ADR 0058,
# docs/ops/email.md): the codes go out through Resend with a key that may
# only send from the domain of MAIL_FROM. No key: the recovery email is off
# (has_recovery is false, a forgotten password is reset after 7 days or by
# pluma-admin password reset). The codes are HMACs under
# LOGIN_CODE_HMAC_KEY. DailyLimit caps the emails of the whole server in a
# UTC day (80 by default, below the 100 of Resend's free plan).
Mail:
  Provider: resend
  ApiKey: "${MAIL_API_KEY}"
  From: "${MAIL_FROM}"

# Seals the secrets of push devices (pkg/pushdevices, task 009).
PushSecretEncryptionKey: "${PUSH_SECRET_ENCRYPTION_KEY}"

BizServiceClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
  # Covers the box transactions of dialog (checked at start).
  Timeout: 30000
AuthSessionClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.media
  Timeout: 120000
IdgenClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: messenger.msg
  Timeout: 45000
DfsClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
  Timeout: 120000
StatusClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.status

# Pushes are rows of mq_outbox in the database of Mysql (ADR 0012).
SyncClient:
  Topic: "Sync-T"

# One-to-one calls (task 068, docs/ops/calls.md): STUN/TURN servers and the
# static-auth-secret of coturn; calls are off without servers.
Calls:
  IceServers: "${CALLS_ICE_SERVERS}"
  TurnSecret: "${CALLS_TURN_SECRET}"
  # The quality parameters of a call (task 077): "pluma" when empty, or
  # "stock", then key=value changes (docs/ops/calls.md).
  Quality: "${CALLS_QUALITY}"

# Group calls of chats and channels (task 093, ADR 0059,
# docs/ops/group-calls.md): the SFU nodes and the client certificate of
# their control API, which is mutual TLS only. No endpoint: group calls are
# off. The overlay docker-compose.sfu.yaml runs the node "main" beside the
# core, sets its endpoint and mounts the certificates; a node on another
# machine is named by GROUPCALLS_SFU_ENDPOINT alone. Name is what the calls'
# table records: it must not change while calls run.
GroupCalls:
  Nodes:
    - Name: main
      Endpoint: "${GROUPCALLS_SFU_ENDPOINT}"
  CertFile: /run/secrets/groupcalls/client.pem
  KeyFile: /run/secrets/groupcalls/client-key.pem
  CAFile: /run/secrets/groupcalls/server-ca.pem
  # Cameras on at once in a call; the node's Limits.MaxVideos.
  VideoLimit: 30

# Voice transcription (task 090, ADR 0056, docs/ops/transcription.md): the
# speech engine is a service with POST /v1/audio/transcriptions of the OpenAI
# API, app/ops/stt or any other. No URL: transcription is off. Nothing a
# user asks for is refused for its length or number; the settings of the
# queue (Workers, MaxAttempts, FailedTTL, SyncWait, DeliverDelay) have
# defaults and are set here when they must differ.
Transcribe:
  URL: "${STT_URL}"
  Token: "${STT_TOKEN}"
  Model: "${STT_MODEL}"
  Language: "${STT_LANGUAGE}"
  Timeout: "${STT_TIMEOUT}"
