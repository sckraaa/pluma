Http:
  Name: interface.httpserver
  Host: 0.0.0.0
  Port: 8801
  Timeout: 0
  MaxBytes: 67108864
  Log:
    ServiceName: interface.httpserver
    #Mode: file
    #Path: ../logs/httpserver
    # debug is for troubleshooting; no level logs keys, login codes or message content.
    Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20011
  Path: /metrics
#链路追踪
Telemetry:
  Name: interface.httpserver
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
# MTProto server RSA key, the same as gnetway's (docs/ops/security-setup.md).
KeyFile: "/run/secrets/server_pkcs1.key" # compose secret, see docker-compose.yaml
KeyFingerprint: "${SERVER_RSA_KEY_FINGERPRINT}"

Session:
  Etcd:
    Hosts:
      - etcd:2379
    Key: interface.session
  Timeout: 0
