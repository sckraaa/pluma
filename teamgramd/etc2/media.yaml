Name: service.media
ListenOn: 0.0.0.0:20650
Etcd:
  Hosts:
    - etcd:2379
  Key: service.media
Timeout: 120000
Log:
  ServiceName: service.media
  #Mode: file
  #Path: ../logs/media
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20651
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.media
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 64
  Idle: 64
  IdleTimeout: 4h

Cache:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"

Dfs:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.dfs
  Timeout: 120000
