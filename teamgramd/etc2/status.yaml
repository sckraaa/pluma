Name: service.status
ListenOn: 0.0.0.0:20670
Etcd:
  Hosts:
    - etcd:2379
  Key: service.status
Log:
  ServiceName: service.status
  #Mode: file
  #Path: ../logs/status
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20671
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.status
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc
  
Status:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"

StatusExpire: 90