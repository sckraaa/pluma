Name: messenger.sync
ListenOn: 0.0.0.0:20420
Etcd:
  Hosts:
    - etcd:2379
  Key: messenger.sync
Log:
  ServiceName: messenger.sync
  #Mode: file
  #Path: ../logs/sync
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
# #监控
Prometheus:
  Host: 0.0.0.0
  Port: 20421
  Path: /metrics
# #链路追踪
# Telemetry:
#   Name: messenger.sync
#   Endpoint: jaeger:4317
#   Sampler: 1.0
#   Batcher: otlpgrpc
  
SyncConsumer:
  Brokers:
    - kafka:9092
  Topic: "Sync-T"
  Group: "Sync-MainCommunity-S"


Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(mysql:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 64
  Idle: 64
  IdleTimeout: 4h

Cache:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"
KV:
  - Host: redis:6379
    Pass: "${REDIS_PASSWORD}"

StatusClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.status
SessionClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - etcd:2379
    Key: interface.session

ChannelClient:
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
ChatClient:
  Timeout: 5000
  Etcd:
    Hosts:
      - etcd:2379
    Key: service.biz_service
