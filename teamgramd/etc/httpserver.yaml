Http:
  Name: interface.httpserver
  Host: 0.0.0.0
  Port: 8801
  Timeout: 0
  MaxBytes: 67108864
  Log:
    ServiceName: interface.httpserver
    Mode: file
    Path: ../logs/httpserver
    Level: debug
  ##监控
  #Prometheus:
  #  Host: 0.0.0.0
  #  Port: 20011
  #  Path: /metrics
  ##链路追踪
  #Telemetry:
  #  Name: interface.httpserver
  #  Endpoint: http://127.0.0.1:14268/api/traces
  #  Sampler: 1.0
  #  Batcher: jaeger
    
# MTProto server RSA key, the same as gnetway's (docs/ops/security-setup.md).
KeyFile: "../../secrets/server_pkcs1.key" # relative to teamgramd/bin
KeyFingerprint: "${SERVER_RSA_KEY_FINGERPRINT}"

Session:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: interface.session
  Timeout: 0
