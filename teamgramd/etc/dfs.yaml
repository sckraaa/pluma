Name: service.dfs
ListenOn: 127.0.0.1:20640
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: service.dfs
Timeout: 120000
Log:
  ServiceName: service.dfs
  Mode: file
  Path: ../logs/dfs
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
##监控
#Prometheus:
#  Host: 0.0.0.0
#  Port: 20641
#  Path: /metrics
##链路追踪
#Telemetry:
#  Name: service.dfs
#  Endpoint: http://127.0.0.1:14268/api/traces
#  Sampler: 1.0
#  Batcher: jaeger

# Serves uploaded files to dfs's own ffmpeg (http://127.0.0.1:11701), without
# authentication: loopback only. No timeout: ffmpeg reads while it transcodes.
MiniHttp:
  Name: service.dfs.minihttp
  Host: 127.0.0.1
  Port: 11701
  Timeout: 120000
Cache:
  - Host: 127.0.0.1:6379
    Pass: "${REDIS_PASSWORD}"
Minio:
  Endpoint: 127.0.0.1:3900
  AccessKeyID: "${S3_ACCESS_KEY_ID}"
  SecretAccessKey: "${S3_SECRET_ACCESS_KEY}"
  UseSSL: false
  Region: garage
  Bucket:
    Documents: documents
    Photos: photos
    Videos: videos
    EncryptedFiles: encryptedfiles
IdGen:
  Timeout: 2000
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.idgen
SSDB:
  - Host: 127.0.0.1:6379 # if use pika, change to 9221
    Pass: "${REDIS_PASSWORD}"
