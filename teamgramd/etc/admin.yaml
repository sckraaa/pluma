# The moderation panel (app/ops/admin, ADR 0040, docs/ops/admin-panel.md).
# It runs with the host's network (docker-compose.admin.yaml) so that it
# listens on the real loopback address: tailscale serve is the only way in.

# Must be a loopback address. The service refuses to start otherwise.
Listen: 127.0.0.1:9100

# The https address of the panel in the tailnet; its host is the WebAuthn
# relying party. The passkeys are bound to it: changing it means registering
# them again.
Origin: "${PANEL_ORIGIN}"

Log:
  ServiceName: admin
  Mode: console
  Encoding: json
  Level: info

# A database user of its own (docs/ops/admin-panel.md): its own tables, SELECT
# on what it reads, and INSERT on mq_outbox for the pushes of a session end.
Mysql:
  DSN: "pluma_admin:${ADMIN_MYSQL_PASSWORD}@tcp(127.0.0.1:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 8
  Idle: 2
  IdleTimeout: 4h

BizServiceClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service
  Timeout: 30000
MsgClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: messenger.msg
  Timeout: 30000
AuthSessionClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.authsession
  Timeout: 5000
DfsClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.dfs
  Timeout: 20000

# Pushes that end a banned user's sessions: rows of mq_outbox, as bff writes
# them.
SyncClient:
  Topic: "Sync-T"

# Redis of bff: the login codes shown on request (pkg/logincode, the same
# HMAC key as bff) and the 2FA state of a deleted account (pkg/twofa). The
# port is published on the host's loopback.
KV:
  - Host: 127.0.0.1:6379
    Pass: "${REDIS_PASSWORD}"
LoginCode:
  HmacKey: "${LOGIN_CODE_HMAC_KEY}"
  ReviewPhone: "${LOGIN_REVIEW_PHONE}"
  ReviewCode: "${LOGIN_REVIEW_CODE}"

# What the Overview and System pages read: Prometheus on the host's loopback,
# and the link to Grafana (empty: no link).
Prometheus: "http://127.0.0.1:9090"
GrafanaUrl: "${PANEL_GRAFANA_URL}"

# The releases service: list, roll back and bring back builds
# (docs/ops/releases.md). Empty token: the page says it is not configured.
Releases:
  Url: "http://127.0.0.1:9097"
  Token: "${RELEASES_ADMIN_TOKEN}"
