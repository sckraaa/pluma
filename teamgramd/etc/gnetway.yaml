Name: interface.gateway
ListenOn: 127.0.0.1:20110
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: interface.gateway
Log:
  ServiceName: interface.gateway
  Mode: file
  Path: ../logs/gnetway
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
##监控
#Prometheus:
#  Host: 0.0.0.0
#  Port: 20111
#  Path: /metrics
##链路追踪
#Telemetry:
#  Name: interface.gateway
#  Endpoint: http://127.0.0.1:14268/api/traces
#  Sampler: 1.0
#  Batcher: jaeger
  
# MTProto server RSA keys (docs/ops/security-setup.md). Generate with
# tools/genserverkey; the file must not be accessible by other users and must
# match KeyFingerprint, otherwise gnetway refuses to start. List a second key
# here to rotate without breaking clients that still embed the old one.
RSAKey:
  - KeyFile: "../../secrets/server_pkcs1.key" # relative to teamgramd/bin
    KeyFingerprint: "${SERVER_RSA_KEY_FINGERPRINT}"
MaxProc: 4

Gnetway:
  Server:
    - Proto: tcp
      Addresses:
        - 0.0.0.0:10443
        - 0.0.0.0:5222
    - Proto: websocket
      Addresses:
        - 0.0.0.0:11443
  Multicore: false
  SendBuf: 65536
  ReceiveBuf: 65536

Session:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: interface.session
