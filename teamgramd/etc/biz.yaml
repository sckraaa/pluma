Name: service.biz_service
ListenOn: 127.0.0.1:20020
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: service.biz_service
# dialog runs box transactions (pkg/userbox): the deadline outlives them
# (dialog.MaxBoxOpTime, checked at start; docs/ops/user-state.md).
Timeout: 30000
Log:
  ServiceName: service.biz_service
  Mode: file
  Path: ../logs/biz
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
##监控
#Prometheus:
#  Host: 0.0.0.0
#  Port: 20021
#  Path: /metrics
##链路追踪
#Telemetry:
#  Name: service.biz_service
#  Endpoint: http://127.0.0.1:14268/api/traces
#  Sampler: 1.0
#  Batcher: jaeger

Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(127.0.0.1:3306)/teamgram?charset=utf8mb4&parseTime=true&innodb_lock_wait_timeout=2"
  Active: 64
  Idle: 64
  IdleTimeout: 4h

Cache:
  - Host: localhost:6379
    Pass: "${REDIS_PASSWORD}"
KV:
  - Host: localhost:6379
    Pass: "${REDIS_PASSWORD}"

MediaClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.media
