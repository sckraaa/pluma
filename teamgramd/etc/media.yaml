Name: service.media
ListenOn: 127.0.0.1:20650
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: service.media
Timeout: 120000
Log:
  ServiceName: service.media
  Mode: file
  Path: ../logs/media
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
