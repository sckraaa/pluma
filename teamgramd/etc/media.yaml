Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(127.0.0.1:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 16
  Idle: 16
  IdleTimeout: 4h

Cache:
  - Host: 127.0.0.1:6379
    Pass: "${REDIS_PASSWORD}"

Dfs:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.dfs
  Timeout: 120000
