Name: messenger.sync
ListenOn: 127.0.0.1:20420
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: messenger.sync
Log:
  ServiceName: messenger.sync
  Mode: file
  Path: ../logs/sync
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
##监控
Prometheus:
  Host: 127.0.0.1
  Port: 20421
  Path: /metrics
# #链路追踪
#Telemetry:
#  Name: messenger.sync
#  Endpoint: http://127.0.0.1:14268/api/traces
#  Sampler: 1.0
#  Batcher: jaeger
  
SyncConsumer:
  Brokers:
    - 127.0.0.1:9092
  Topic: "Sync-T"
  Group: "Sync-MainCommunity-S"


Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(127.0.0.1:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 64
  Idle: 64
  IdleTimeout: 4h

Cache:
  - Host: 127.0.0.1:6379
    Pass: "${REDIS_PASSWORD}"
KV:
  - Host: 127.0.0.1:6379
    Pass: "${REDIS_PASSWORD}"

StatusClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.status
SessionClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: interface.session

ChannelClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service
ChatClient:
  Timeout: 5000
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service
