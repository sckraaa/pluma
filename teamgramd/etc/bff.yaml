Name: bff.bff
ListenOn: 127.0.0.1:20010
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: bff.bff
Timeout: 150000
Log:
  ServiceName: bff.bff
  Mode: file
  Path: ../logs/bff
  # debug is for troubleshooting; no level logs keys, login codes or message content.
  Level: info
##监控
#Prometheus:
#  Host: 0.0.0.0
#  Port: 20011
#  Path: /metrics
##链路追踪
#Telemetry:
#  Name: bff.bff
#  Endpoint: http://127.0.0.1:14268/api/traces
#  Sampler: 1.0
#  Batcher: jaeger

KV:
  - Host: localhost:6379
    Pass: "${REDIS_PASSWORD}"

# Phone allowlist (closed registration): table phone_allowlist,
# managed with tools/pluma-admin. See docs/ops/security-setup.md.
Mysql:
  DSN: "teamgram:${MYSQL_PASSWORD}@tcp(127.0.0.1:3306)/teamgram?charset=utf8mb4&parseTime=true"
  Active: 8
  Idle: 4
  IdleTimeout: 4h

# Login codes: random, stored in Redis only as HMAC-SHA256 under this key;
# delivered in the app or issued by `pluma-admin login-code`. There is no SMS
# provider. One account may have a fixed code, for the App Store reviewers
# (LOGIN_REVIEW_PHONE, LOGIN_REVIEW_CODE; both empty: none).
LoginCode:
  HmacKey: "${LOGIN_CODE_HMAC_KEY}"
  ReviewPhone: "${LOGIN_REVIEW_PHONE}"
  ReviewCode: "${LOGIN_REVIEW_CODE}"
  # The service that writes codes from a Telegram account
  # (docs/ops/login-codes.md); both empty: no such service.
  SenderURL: "${LOGIN_CODES_SENDER_URL}"
  SenderToken: "${LOGIN_CODES_SENDER_TOKEN}"

# Seals the secrets of push devices (pkg/pushdevices, task 009).
PushSecretEncryptionKey: "${PUSH_SECRET_ENCRYPTION_KEY}"

BizServiceClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service
  # Covers the box transactions of dialog (checked at start).
  Timeout: 30000
AuthSessionClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.authsession
MediaClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.media
  Timeout: 120000
IdgenClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.idgen
MsgClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: messenger.msg
  Timeout: 45000
DfsClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.dfs
  Timeout: 120000
StatusClient:
  Timeout: 2000
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.status

# Pushes are rows of mq_outbox in the database of Mysql (ADR 0012).
SyncClient:
  Topic: "Sync-T"

# One-to-one calls (task 068, docs/ops/calls.md): STUN/TURN servers and the
# static-auth-secret of coturn; calls are off without servers.
Calls:
  IceServers: "${CALLS_ICE_SERVERS}"
  TurnSecret: "${CALLS_TURN_SECRET}"
