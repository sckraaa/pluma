# Builds the images a server runs and pushes them to GHCR, tagged with the
# commit (docs/ops/deployment.md): the teamgram services (Dockerfile),
# alertpush, backup and iosinstall. A server names the commit it runs in its .env and
# only pulls; nothing is built on it. linux/amd64 only, the architecture of
# the server. CI calls it for a push to master once everything has passed; a
# manual run builds the commit it is started on. The layers are kept in the
# GitHub Actions cache, each image's apart: TDLib, the long part of
# pluma-codes, is rebuilt only when its commit changes. A cache that cannot
# be written costs time, not the image.
name: images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pluma-server
            dockerfile: Dockerfile
          - name: pluma-alertpush
            dockerfile: teamgramd/deploy/alertpush/Dockerfile
          - name: pluma-backup
            dockerfile: teamgramd/deploy/backup/Dockerfile
          - name: pluma-iosinstall
            dockerfile: teamgramd/deploy/iosinstall/Dockerfile
          - name: pluma-codes
            dockerfile: teamgramd/deploy/codes/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          # max keeps the layers of the stages too, which is what TDLib is;
          # the stages of the other images change with every commit.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=${{ matrix.name == 'pluma-codes' && 'max' || 'min' }},ignore-error=true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
