# End-to-end test stack (docs/ops/testing.md): applied on top of
# docker-compose-env.yaml and docker-compose.yaml by test/e2e/run.sh, which
# starts only the services listed there (the core: MySQL, Redis, Kafka with
# its topics, etcd, MinIO, Jaeger, the teamgram services and the SFU). Elasticsearch, Kibana, filebeat, go-stash and
# the metrics stack are never started in tests.
#
# Everything a test run creates is thrown away with `down -v`: no fixed
# container names, no host ports except loopback ones (an ephemeral port for
# the MTProto gateway, a free one run.sh picks for the SFU), no bind-mounted
# ./data, no fixed subnet, so the test stack can run next to a development
# stack on the same Docker host. Containers are
# not restarted: a crash must fail the test, not be hidden by a restart.

services:
  kafka:
    container_name: !reset null
    ports: !reset []
    restart: "no"

  kafka-init:
    restart: "no"

  etcd:
    container_name: !reset null
    ports: !reset []
    volumes: !reset []
    restart: "no"

  redis:
    container_name: !reset null
    ports: !reset []
    volumes: !reset []
    restart: "no"

  mysql:
    container_name: !reset null
    ports: !reset []
    # The schema is applied by the migrate service, as in production; the
    # data lives in memory.
    volumes: !reset []
    tmpfs:
      - /var/lib/mysql
    restart: "no"

  garage:
    container_name: !reset null
    ports: !reset []
    # A volume of the test project, shared with the backup service.
    volumes: !override
      - ./teamgramd/deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage_e2e:/var/lib/garage
    restart: "no"

  jaeger:
    container_name: !reset null
    ports: !reset []
    # A full run writes more spans than the production limit is sized for.
    mem_limit: 1g
    memswap_limit: 1g
    # Spans are kept in memory, the newest traces only, as in production
    # (docker-compose-env.yaml): with no bound a full run outgrew even 1 GB.
    environment: !override
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=10000
    depends_on: !reset []
    restart: "no"

  # The teamgram services take their image and restart policy from
  # TEAMGRAM_IMAGE and TEAMGRAM_RESTART (set by run.sh); here they only wait
  # for the infrastructure. The others start after these (depends_on chain in
  # docker-compose.yaml).
  idgen: &needs-infra
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      jaeger:
        condition: service_started
  status: *needs-infra
  authsession:
    <<: *needs-infra
    # No GeoIP database in the tests, and nothing mounted from the working
    # tree: every place is UNKNOWN.
    volumes: !reset []
  dfs: *needs-infra

  gnetway:
    # Ephemeral ports on the loopback interface (run.sh asks Docker for
    # them), or fixed ones for a development client: E2E_GATEWAY_PORT 10443
    # for one in an emulator, which dials 10.0.2.2:10443, E2E_GATEWAY_WS_PORT
    # for a web client, which opens ws://localhost:<port>/apiws
    # (docs/ops/clients.md).
    ports: !override
      - "127.0.0.1:${E2E_GATEWAY_PORT:-}:10443"
      - "127.0.0.1:${E2E_GATEWAY_WS_PORT:-}:11443"

  # The pages of pluma.chat links (task 026): the tests read a page on an
  # ephemeral loopback port (PLUMA_E2E_LINKS).
  links:
    ports:
      - "127.0.0.1::9096"

  # APNs and FCM of the tests (test/e2e/fakepush): the push service sends
  # there, the tests read what came on an ephemeral loopback port.
  fakepush:
    build:
      context: .
      dockerfile: test/e2e/fakepush/Dockerfile
    image: ${E2E_FAKEPUSH_IMAGE:-pluma-e2e-fakepush:local}
    ports:
      - "127.0.0.1::8080"
    networks:
      - teamgram_net
    restart: "no"

  # The Telegram account that writes login codes (test/e2e/fakecodes): bff
  # sends it codes as to app/ops/codes; the tests choose its answers and read
  # the codes on an ephemeral loopback port.
  fakecodes:
    build:
      context: .
      dockerfile: test/e2e/fakecodes/Dockerfile
    image: ${E2E_FAKECODES_IMAGE:-pluma-e2e-fakecodes:local}
    environment:
      CODES_API_TOKEN: ${LOGIN_CODES_SENDER_TOKEN:?run test/e2e/run.sh up}
    ports:
      - "127.0.0.1::8080"
    networks:
      - teamgram_net
    restart: "no"

  # The speech engine of voice transcription (test/e2e/fakestt): bff sends
  # it sound as to app/ops/stt; the tests plan its answers and count the
  # requests on an ephemeral loopback port.
  fakestt:
    build:
      context: .
      dockerfile: test/e2e/fakestt/Dockerfile
    image: ${E2E_FAKESTT_IMAGE:-pluma-e2e-fakestt:local}
    environment:
      STT_API_TOKEN: ${STT_TOKEN:?run test/e2e/run.sh up}
      STT_MODEL: ${STT_MODEL:?run test/e2e/run.sh up}
    ports:
      - "127.0.0.1::8080"
    networks:
      - teamgram_net
    restart: "no"

  # The translation engine of messages (test/e2e/faketranslate, task 101):
  # bff sends it the prompts of the model as to the translate service of
  # docker-compose.translate.yaml (TRANSLATE_URL in the env file of
  # run.sh); the tests plan its answers and count the requests on an
  # ephemeral loopback port.
  faketranslate:
    build:
      context: .
      dockerfile: test/e2e/faketranslate/Dockerfile
    image: ${E2E_FAKETRANSLATE_IMAGE:-pluma-e2e-faketranslate:local}
    environment:
      TRANSLATE_API_TOKEN: ${TRANSLATE_TOKEN:?run test/e2e/run.sh up}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:?run test/e2e/run.sh up}
    ports:
      - "127.0.0.1::8080"
    networks:
      - teamgram_net
    restart: "no"

  # The mail provider of the recovery email (test/e2e/fakemail): bff sends
  # it emails as to Resend; the tests plan its errors and read the codes on
  # an ephemeral loopback port.
  fakemail:
    build:
      context: .
      dockerfile: test/e2e/fakemail/Dockerfile
    image: ${E2E_FAKEMAIL_IMAGE:-pluma-e2e-fakemail:local}
    environment:
      MAIL_API_KEY: ${MAIL_API_KEY:?run test/e2e/run.sh up}
    ports:
      - "127.0.0.1::8080"
    networks:
      - teamgram_net
    restart: "no"

  # The maps service of the map previews (test/e2e/fakemaps, task 100): bff
  # renders maps there (MAPS_URL in the env file of run.sh); the tests plan
  # its answers and read the requests on an ephemeral loopback port.
  fakemaps:
    build:
      context: .
      dockerfile: test/e2e/fakemaps/Dockerfile
    image: ${E2E_FAKEMAPS_IMAGE:-pluma-e2e-fakemaps:local}
    environment:
      MAPS_STYLES: ${MAPS_STYLES:-}
    ports:
      - "127.0.0.1::8080"
    networks:
      - teamgram_net
    restart: "no"

  # The web of the built-in inline bots and of web files
  # (test/e2e/fakeinline, task 099): the SearXNG of @pic (SEARXNG_URL in the
  # env file of run.sh) and the sites of the pictures it finds and inline
  # bots name, which bff may fetch from although they are on the network of
  # the services (WebFetch.AllowHosts in the bff config of run.sh). The tests
  # plan its answers and read the requests on an ephemeral loopback port.
  fakeinline:
    build:
      context: .
      dockerfile: test/e2e/fakeinline/Dockerfile
    image: ${E2E_FAKEINLINE_IMAGE:-pluma-e2e-fakeinline:local}
    ports:
      - "127.0.0.1::8080"
    networks:
      - teamgram_net
    restart: "no"

  # The Gcore CDN resource of the HTTPS CDN (test/e2e/fakecdn, task 107):
  # bff redirects large files to it (CDN_GCORE_BASE_URL in the env file of
  # run.sh, http://fakecdn:8080 unless E2E_CDN_ADDRESS gives another) and
  # checks it, and it pulls the cipher from bff's origin with the run's
  # CDN_ORIGIN_AUTH and checks the run's Secure Token key. The tests reach
  # the CDN on an ephemeral loopback port (E2E_CDN_PUBLISH, set by run.sh
  # for E2E_CDN_ADDRESS, publishes it where a development client reaches
  # it), and its control API on another one that no client is given.
  fakecdn:
    build:
      context: .
      dockerfile: test/e2e/fakecdn/Dockerfile
    image: ${E2E_FAKECDN_IMAGE:-pluma-e2e-fakecdn:local}
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      FAKECDN_ORIGIN: http://bff:20480
      FAKECDN_CACHE_MB: "256"
      CDN_ORIGIN_AUTH: ${CDN_ORIGIN_AUTH:?run test/e2e/run.sh up}
      CDN_GCORE_SIGNER: ${CDN_GCORE_SIGNER:-}
      CDN_GCORE_TOKEN_KEY: ${CDN_GCORE_TOKEN_KEY:?run test/e2e/run.sh up}
    ports:
      - "${E2E_CDN_PUBLISH:-127.0.0.1::8080}"
      - "127.0.0.1::8081"
    networks:
      - teamgram_net
    restart: "no"

  bff:
    # The config with the limits of transcription and the waits of
    # translation, the mail provider of the tests and the hosts of
    # fakeinline, written by run.sh. The CDN of large files is fakecdn.
    volumes:
      - ${E2E_BFF_CONFIG:?run test/e2e/run.sh up}:/app/etc2/bff.yaml:ro
    depends_on:
      fakecdn:
        condition: service_started
      fakestt:
        condition: service_started
      faketranslate:
        condition: service_started
      fakemail:
        condition: service_started
      fakemaps:
        condition: service_started
      fakeinline:
        condition: service_started

  # The SFU of group calls (docker-compose.sfu.yaml): its media ports on the
  # loopback interface, at the port run.sh picks for the run, which its
  # answers to joins name (SFU_PUBLIC_IPV4 and SFU_*_PORT in its env file);
  # the tests' clients reach it there as the official clients reach the
  # published ports of a server. The control certificates are the run's.
  sfu:
    ports: !override
      - "127.0.0.1:${SFU_UDP_PORT:?run test/e2e/run.sh up}:20600/udp"
      - "127.0.0.1:${SFU_TCP_PORT:?run test/e2e/run.sh up}:20601/tcp"
    restart: "no"

  push:
    # The config with the endpoints of fakepush, written by run.sh.
    volumes:
      - ${E2E_PUSH_CONFIG:?run test/e2e/run.sh up}:/app/etc2/push.yaml:ro
    depends_on:
      fakepush:
        condition: service_started

  backup:
    container_name: !reset null
    volumes: !override
      - garage_e2e:/data/files:ro
      - ${SERVER_RSA_KEY_FILE}:/data/secrets/server_pkcs1.key:ro
      - node_textfile:/textfile
      # The restic repository is a local volume in the tests.
      - restic_e2e:/repo
    restart: "no"

volumes:
  garage_e2e:
  restic_e2e:

networks:
  teamgram_net:
    # Docker picks a free subnet: 172.20.0.0/16 may be taken on a shared host.
    ipam: !reset {}
