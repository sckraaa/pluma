# End-to-end test stack (docs/ops/testing.md): applied on top of
# docker-compose-env.yaml and docker-compose.yaml by test/e2e/run.sh, which
# starts only the services listed there (the core: MySQL, Redis, Kafka with
# its topics, etcd, MinIO, Jaeger and the teamgram services). Elasticsearch, Kibana, filebeat, go-stash and
# the metrics stack are never started in tests.
#
# Everything a test run creates is thrown away with `down -v`: no fixed
# container names, no host ports except an ephemeral loopback port for the
# MTProto gateway, no bind-mounted ./data, no fixed subnet, so the test stack
# can run next to a development stack on the same Docker host. Containers are
# not restarted: a crash must fail the test, not be hidden by a restart.

services:
  kafka:
    container_name: !reset null
    ports: !reset []
    restart: "no"

  kafka-init:
    restart: "no"

  etcd:
    container_name: !reset null
    ports: !reset []
    volumes: !reset []
    restart: "no"

  redis:
    container_name: !reset null
    ports: !reset []
    volumes: !reset []
    restart: "no"

  mysql:
    container_name: !reset null
    ports: !reset []
    # The schema is applied by the migrate service, as in production; the
    # data lives in memory.
    volumes: !reset []
    tmpfs:
      - /var/lib/mysql
    restart: "no"

  garage:
    container_name: !reset null
    ports: !reset []
    # A volume of the test project, shared with the backup service.
    volumes: !override
      - ./teamgramd/deploy/garage/garage.toml:/etc/garage.toml:ro
      - garage_e2e:/var/lib/garage
    restart: "no"

  jaeger:
    container_name: !reset null
    ports: !reset []
    # Spans are kept in memory: the production setup stores them in
    # Elasticsearch, which tests do not start.
    environment: !override
      - SPAN_STORAGE_TYPE=memory
    depends_on: !reset []
    restart: "no"

  # The teamgram services take their image and restart policy from
  # TEAMGRAM_IMAGE and TEAMGRAM_RESTART (set by run.sh); here they only wait
  # for the infrastructure. The others start after these (depends_on chain in
  # docker-compose.yaml).
  idgen: &needs-infra
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      jaeger:
        condition: service_started
  status: *needs-infra
  authsession:
    <<: *needs-infra
    # No GeoIP database in the tests, and nothing mounted from the working
    # tree: every place is UNKNOWN.
    volumes: !reset []
  dfs: *needs-infra

  gnetway:
    # Ephemeral ports on the loopback interface (run.sh asks Docker for
    # them), or fixed ones for a development client: E2E_GATEWAY_PORT 10443
    # for one in an emulator, which dials 10.0.2.2:10443, E2E_GATEWAY_WS_PORT
    # for a web client, which opens ws://localhost:<port>/apiws
    # (docs/ops/clients.md).
    ports: !override
      - "127.0.0.1:${E2E_GATEWAY_PORT:-}:10443"
      - "127.0.0.1:${E2E_GATEWAY_WS_PORT:-}:11443"

  # APNs and FCM of the tests (test/e2e/fakepush): the push service sends
  # there, the tests read what came on an ephemeral loopback port.
  fakepush:
    build:
      context: .
      dockerfile: test/e2e/fakepush/Dockerfile
    image: pluma-e2e-fakepush:local
    ports:
      - "127.0.0.1::8080"
    networks:
      - teamgram_net
    restart: "no"

  push:
    # The config with the endpoints of fakepush, written by run.sh.
    volumes:
      - ${E2E_PUSH_CONFIG:?run test/e2e/run.sh up}:/app/etc2/push.yaml:ro
    depends_on:
      fakepush:
        condition: service_started

  backup:
    container_name: !reset null
    volumes: !override
      - garage_e2e:/data/files:ro
      - ${SERVER_RSA_KEY_FILE}:/data/secrets/server_pkcs1.key:ro
      - node_textfile:/textfile
      # The restic repository is a local volume in the tests.
      - restic_e2e:/repo
    restart: "no"

volumes:
  garage_e2e:
  restic_e2e:

networks:
  teamgram_net:
    # Docker picks a free subnet: 172.20.0.0/16 may be taken on a shared host.
    ipam: !reset {}
