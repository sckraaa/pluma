# Infrastructure of Pluma: Kafka, MySQL, Redis, etcd, object storage, and the
# observability stack (Prometheus, Alertmanager with phone pushes, Grafana,
# Loki logs, Jaeger traces) plus scheduled backups. The services themselves
# are in docker-compose.yaml; both files are one compose project.
#
# Security (docs/ops/security-setup.md): nothing here is published on public
# interfaces. Services talk over teamgram_net; ports that are useful for local
# administration are bound to 127.0.0.1 only (Docker port publishing bypasses
# host firewalls such as ufw). Passwords come from .env; compose refuses to
# start while a required one is missing.

services:
  # --- 消息队列 (Bitnami Kafka KRaft 模式，无需 Zookeeper) ---
  #消息队列 - Message queue
  kafka:
    image: apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    container_name: kafka
    ports:
      - "127.0.0.1:9092:9092"  # 容器内部之间使用的监听端口
      - "127.0.0.1:9094:9094"  # 容器外部访问监听端口
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Topics come from teamgramd/deploy/kafka/topics.sh (kafka-init) only:
      # a topic made on first use would have the wrong partitions.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 外部访问监听端口为 9092，容器内部使用不同的端口 9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094,CONTROLLER://localhost:9093,PLAINTEXT_CONTAINER://kafka:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,PLAINTEXT_CONTAINER://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_CONTAINER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      # Named volume avoids host bind-mount permission errors (AccessDeniedException on
      # bootstrap.checkpoint.tmp when ./data/kafka/data is root-owned from sudo compose).
      - kafka_data:/var/lib/kafka/data
    # The services do not wait for it: they connect in the background and
    # the events wait in mq_outbox meanwhile (ADR 0012). kafka-init does.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - teamgram_net

  # Creates the topics and sets their parameters, then exits; safe to run
  # again (teamgramd/deploy/kafka/topics.sh).
  kafka-init:
    image: apache/kafka:3.9.0@sha256:fbc7d7c428e3755cf36518d4976596002477e4c052d1f80b5b9eafd06d0fff2f
    entrypoint: ["bash", "/topics.sh", "kafka:9092"]
    volumes:
      - ./teamgramd/deploy/kafka/topics.sh:/topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - teamgram_net

  # --- 配置与发现 ---
  etcd:
    image: quay.io/coreos/etcd:v3.5.11@sha256:8429758911821e36a15e2fe6ae75cfd563a501c97af0b3d119c74921f5fb6f19
    container_name: etcd
    # No authentication: must never be reachable from outside the host.
    ports:
      - "127.0.0.1:2379:2379"
    environment:
      ETCD_NAME: node1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: node1=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: teamgram-etcd
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_AUTO_COMPACTION_RETENTION: 1
    volumes:
      - ./data/etcd:/etcd-data
    restart: always
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teamgram_net

  # --- 缓存 ---
  redis:
    image: redis:7.4.11-alpine@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      # Lets redis-cli (healthcheck, docker exec) authenticate.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - ./data/redis:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - teamgram_net

  # --- 关系数据库 ---
  mysql:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: mysql
    environment:
      # Applied only when ./data/mysql is empty (first start).
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # Database and user the services connect as (teamgramd/etc2 DSNs).
      MYSQL_DATABASE: teamgram
      MYSQL_USER: teamgram
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      # The schema is applied by the migrate service of docker-compose.yaml
      # (pluma-admin migrate up), not by the image's init directory.
      - ./data/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    restart: always
    healthcheck:
      # Over TCP: on the first start the image runs the init scripts on a
      # temporary server reachable only through the socket, so a socket ping
      # would report the database ready before the schema is loaded.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 --protocol=TCP -uroot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - teamgram_net

  # --- 对象存储 ---
  # MinIO no longer publishes images (minio/minio and quay.io/minio are gone
  # since 2026). pgsty/minio and pgsty/mc are community builds of the MinIO
  # community edition from source (https://github.com/pgsty/minio), drop-in
  # compatible with the old images. Pinned by tag and digest.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"  # console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teamgram_net

  # Creates the buckets dfs uses, once MinIO is up; exits when done.
  minio-mc:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    container_name: minio-mc
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb myminio/documents --ignore-existing
        mc mb myminio/encryptedfiles --ignore-existing
        mc mb myminio/photos --ignore-existing
        mc mb myminio/videos --ignore-existing
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - teamgram_net

  # --- 可观测：追踪 ---
  #jaeger链路追踪 — Jaeger for tracing
  jaeger:
    image: jaegertracing/all-in-one:1.63.0@sha256:fd5697c37ba041a91cfca1d62621d32cdeb2041c0febc2f1579e5bac6f21e34b
    container_name: jaeger
    restart: unless-stopped
    # Services send traces over teamgram_net (jaeger:4317); agent ports are not published.
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:14268:14268"  # collector for services run on the host (teamgramd/etc)
    # Traces are a debugging aid: kept in memory, the newest 50000.
    environment:
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=50000
    networks:
      - teamgram_net

  # --- Observability (ADR 0013) ---
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    # Scraped by prometheus over teamgram_net; not published. The textfile
    # collector exports the backup metrics written by the backup service.
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - node_textfile:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile
    restart: unless-stopped
    networks:
      - teamgram_net

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    volumes:
      - ./teamgramd/deploy/prometheus/server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./teamgramd/deploy/prometheus/server/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - teamgram_net

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: alertmanager
    volumes:
      - ./teamgramd/deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    secrets:
      - healthchecks_ping_url
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - teamgram_net

  # Alertmanager -> ntfy pushes on the operator's phone (app/ops/alertpush).
  alertpush:
    build:
      context: .
      dockerfile: teamgramd/deploy/alertpush/Dockerfile
    image: pluma-alertpush:local
    container_name: alertpush
    environment:
      NTFY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env (openssl rand -hex 16)}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    restart: unless-stopped
    networks:
      - teamgram_net

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    environment:
      # Applied on the first start; afterwards change it in Grafana.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./teamgramd/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./teamgramd/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - teamgram_net

  # Logs: Alloy reads the containers' stdout through the Docker API and
  # sends it to Loki (14 days). The services log JSON without keys, codes or
  # message text (tools/logaudit).
  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./teamgramd/deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - teamgram_net

  alloy:
    image: grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    container_name: alloy
    command: ["run", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
    volumes:
      - ./teamgramd/deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only Docker API access to list containers and read their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    restart: unless-stopped
    depends_on:
      - loki
    networks:
      - teamgram_net

volumes:
  kafka_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
  node_textfile:

secrets:
  # The ping URL of the dead man's switch (healthchecks.io), used by
  # Alertmanager's Watchdog route.
  healthchecks_ping_url:
    environment: HEALTHCHECKS_PING_URL

networks:
  teamgram_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
