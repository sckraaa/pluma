# Teamgram services (one container). Infrastructure lives in docker-compose-env.yaml.
# Secrets come from .env (see .env.example and docs/ops/security-setup.md);
# compose refuses to start while a required one is missing.
services:
  teamgram:
    build: .
    restart: always
    # Only the MTProto client ports are published. Internal gRPC (20xxx) and
    # metrics stay on teamgram_net (dfs HTTP on loopback); Docker port publishing bypasses
    # host firewalls such as ufw, so nothing else may be listed here.
    # IPv4 only: teamgram_net has no IPv6, so Docker would accept IPv6
    # clients through docker-proxy and the gateway would see them all as the
    # bridge address, which breaks per-address login limits and the IPs shown
    # to users and pluma-admin. For IPv6, enable it on teamgram_net (or run
    # gnetway with host networking) first; see docs/ops/security-setup.md §3.
    ports:
      - "0.0.0.0:10443:10443" # MTProto TCP
      - "0.0.0.0:5222:5222"   # MTProto TCP, alternative port
      - "0.0.0.0:11443:11443" # MTProto over WebSocket (Web clients)
    environment:
      # Read by the service configs in teamgramd/etc2 as ${NAME}.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      SERVER_RSA_KEY_FINGERPRINT: ${SERVER_RSA_KEY_FINGERPRINT:?set SERVER_RSA_KEY_FINGERPRINT in .env (printed by tools/genserverkey)}
      LOGIN_CODE_HMAC_KEY: ${LOGIN_CODE_HMAC_KEY:?set LOGIN_CODE_HMAC_KEY in .env (openssl rand -hex 32)}
    secrets:
      # Mounted read-only at /run/secrets/server_pkcs1.key (teamgramd/etc2/gnetway.yaml).
      - source: server_rsa_key
        target: server_pkcs1.key
    networks:
      - teamgram_net

secrets:
  server_rsa_key:
    # Host path of the private key generated by tools/genserverkey (mode 0600, never in git).
    file: ${SERVER_RSA_KEY_FILE:-./secrets/server_pkcs1.key}

networks:
  teamgram_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
